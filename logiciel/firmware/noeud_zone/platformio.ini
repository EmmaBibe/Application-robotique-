; Micrologiciel des automates de zone (ESP32 avec Ethernet filaire, type carte
; industrielle rail DIN à PHY LAN8720). Un environnement par zone.

[env]
platform = espressif32@6.9.0
board = esp32-poe
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
    4-20ma/ModbusMaster@2.0.1
build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024

[env:fruits]
build_flags = ${env.build_flags} -D ZONE=\"fruits\" -D ZONE_FRUITS

[env:feuilles]
build_flags = ${env.build_flags} -D ZONE=\"feuilles\" -D ZONE_FEUILLES
