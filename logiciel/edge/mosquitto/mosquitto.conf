# Courtier MQTT local. Aucun accès anonyme.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Pour l'interface web en direct (MQTT sur WebSocket), décommenter :
# listener 9001
# protocol websockets
