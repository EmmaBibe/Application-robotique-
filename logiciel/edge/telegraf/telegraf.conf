# Collecte : MQTT -> InfluxDB

[agent]
  interval = "30s"
  flush_interval = "30s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "telegraf"
  password = "${MQTT_MOT_DE_PASSE_TELEGRAF}"
  topics = [
    "serre/lub1/+/mesure/#",
    "serre/lub1/+/mesure",
    "serre/lub1/+/etat/#",
  ]
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix"
  tag_keys = []
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "serre/lub1/+/+/+"
    tags = "_/site/zone/nature/objet"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_JETON}"
  organization = "serre"
  bucket = "mesures"
