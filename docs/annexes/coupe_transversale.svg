<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold">Coupe transversale nord-sud (configuration optimisée, 1 m = 50 px)</text>
  <!-- sol -->
  <rect x="0" y="520" width="1000" height="120" fill="#efe6d6"/>
  <line x1="0" y1="520" x2="1000" y2="520" stroke="#6b5a3a" stroke-width="2"/>
  <!-- annexe : x 100..250, hauteur 3 m au sud, pente vers le nord -->
  <path d="M100,520 L100,370 L250,402 L250,520Z" fill="#f7f1e6" stroke="#7a5a1e" stroke-width="2"/>
  <line x1="104" y1="364" x2="250" y2="396" stroke="#1f3f6b" stroke-width="6"/>
  <text x="175" y="355" text-anchor="middle" font-size="11">panneaux solaires, 12° vers le nord</text>
  <text x="175" y="470" text-anchor="middle">Annexe</text>
  <!-- couloir sas -->
  <rect x="250" y="440" width="50" height="80" fill="#fff6e0" stroke="#a87a1e"/>
  <text x="275" y="434" text-anchor="middle" font-size="10">sas</text>
  <!-- serre : sud x=300, nord x=800 ; chéneau 4 m (y=320), faîtage 6 m (y=220) -->
  <path d="M300,520 L300,320 Q320,232 550,220 Q780,232 800,320 L800,520" fill="#f3f8f3" stroke="#2f5d3a" stroke-width="3"/>
  <!-- cloison -->
  <line x1="550" y1="220" x2="550" y2="520" stroke="#2f5d3a" stroke-width="2" stroke-dasharray="8 5"/>
  <!-- ouvrants de toiture -->
  <path d="M500,224 L470,232" stroke="#3b8fd0" stroke-width="6"/><path d="M600,224 L630,232" stroke="#3b8fd0" stroke-width="6"/>
  <text x="440" y="215" font-size="11" fill="#1f5f86">ouvrant de toiture (feuilles)</text>
  <text x="600" y="210" font-size="11" fill="#1f5f86">ouvrant de toiture (fruits)</text>
  <!-- ouvrants latéraux -->
  <line x1="300" y1="345" x2="300" y2="420" stroke="#3b8fd0" stroke-width="6"/><line x1="800" y1="345" x2="800" y2="420" stroke="#3b8fd0" stroke-width="6"/>
  <text x="808" y="385" font-size="11">ouvrant latéral nord</text>
  <!-- écran -->
  <line x1="302" y1="322" x2="798" y2="322" stroke="#888" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="310" y="315" font-size="11" fill="#555">écran d'ombrage / thermique à 4,0 m</text>
  <!-- tomates palissées : fil à 3,8 m -> y=330 -->
  <line x1="570" y1="330" x2="790" y2="330" stroke="#555"/>
  <g stroke="#3b7a3f" stroke-width="4">
    <line x1="600" y1="505" x2="600" y2="332"/><line x1="640" y1="505" x2="640" y2="332"/>
    <line x1="700" y1="505" x2="700" y2="332"/><line x1="740" y1="505" x2="740" y2="332"/>
  </g>
  <g fill="#c94a3a"><circle cx="606" cy="440" r="6"/><circle cx="646" cy="420" r="6"/><circle cx="706" cy="450" r="6"/><circle cx="746" cy="430" r="6"/></g>
  <g fill="#333"><rect x="590" y="505" width="20" height="15"/><rect x="630" y="505" width="20" height="15"/><rect x="690" y="505" width="20" height="15"/><rect x="730" y="505" width="20" height="15"/></g>
  <text x="680" y="545" text-anchor="middle" font-size="11">seaux hollandais à perlite sur gouttière de drainage</text>
  <text x="680" y="300" text-anchor="middle" font-weight="bold" fill="#8a2b2b">FRUITS</text>
  <!-- bassins : semi-enterrés -->
  <rect x="320" y="505" width="200" height="25" fill="#cfe6f3" stroke="#1f5f86"/>
  <rect x="320" y="498" width="200" height="7" fill="#ffffff" stroke="#999"/>
  <g fill="#5aa05f"><circle cx="340" cy="490" r="8"/><circle cx="370" cy="490" r="8"/><circle cx="400" cy="490" r="8"/><circle cx="430" cy="490" r="8"/><circle cx="460" cy="490" r="8"/><circle cx="490" cy="490" r="8"/></g>
  <text x="420" y="555" text-anchor="middle" font-size="11">bassin à radeaux, 25 cm d'eau, semi-enterré et isolé</text>
  <text x="420" y="300" text-anchor="middle" font-weight="bold" fill="#1f5f86">FEUILLES</text>
  <!-- brassage -->
  <g fill="none" stroke="#777"><circle cx="420" cy="290" r="0"/></g>
  <!-- soleil -->
  <line x1="960" y1="70" x2="760" y2="350" stroke="#e0a400" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="990" y="62" font-size="12" fill="#a87a00" text-anchor="end">juin, midi : 55° au nord</text>
  <line x1="460" y1="60" x2="510" y2="300" stroke="#e0a400" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="330" y="55" font-size="12" fill="#a87a00">décembre, midi : 78° au sud</text>
  <!-- cotes -->
  <g stroke="#777"><line x1="830" y1="520" x2="830" y2="320"/><line x1="822" y1="320" x2="838" y2="320"/><line x1="822" y1="520" x2="838" y2="520"/></g>
  <text x="840" y="440" font-size="12">4,0 m</text>
  <g stroke="#777"><line x1="560" y1="220" x2="580" y2="220"/></g><text x="585" y="245" font-size="12">6,0 m au faîtage</text>
  <g stroke="#777"><line x1="300" y1="580" x2="800" y2="580"/><line x1="300" y1="572" x2="300" y2="588"/><line x1="800" y1="572" x2="800" y2="588"/><line x1="550" y1="572" x2="550" y2="588"/></g>
  <text x="425" y="600" text-anchor="middle">5,0 m</text><text x="675" y="600" text-anchor="middle">5,0 m</text>
  <g stroke="#777"><line x1="250" y1="610" x2="300" y2="610"/></g><text x="275" y="628" text-anchor="middle" font-size="11">2 m</text>
  <text x="60" y="500" font-weight="bold">SUD</text><text x="900" y="500" font-weight="bold">NORD</text>
  <!-- longrine -->
  <rect x="294" y="515" width="12" height="20" fill="#999"/><rect x="794" y="515" width="12" height="20" fill="#999"/>
  <text x="808" y="532" font-size="10">longrine béton</text>
</svg>
