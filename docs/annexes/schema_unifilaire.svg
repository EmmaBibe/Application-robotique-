<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="1240" height="620" fill="#ffffff"/>
  <text x="620" y="30" text-anchor="middle" font-size="18" font-weight="bold">Schéma unifilaire simplifié (configuration complète entre parenthèses)</text>
  <g stroke="#222" stroke-width="2" fill="none">
    <!-- PV -->
    <rect x="40" y="70" width="170" height="70"/>
    <!-- boite DC -->
    <rect x="45" y="190" width="160" height="50"/>
    <line x1="125" y1="140" x2="125" y2="190"/>
    <line x1="125" y1="240" x2="125" y2="290"/>
    <!-- onduleur -->
    <rect x="300" y="270" width="220" height="110"/>
    <line x1="125" y1="290" x2="300" y2="290"/>
    <!-- batterie -->
    <rect x="290" y="450" width="240" height="70"/>
    <line x1="410" y1="380" x2="410" y2="450"/>
    <!-- SNEL -->
    <rect x="40" y="330" width="150" height="60"/>
    <line x1="190" y1="360" x2="300" y2="360"/>
    <!-- groupe -->
    <rect x="30" y="430" width="185" height="60"/>
    <polyline points="215,460 250,460 250,370 300,370"/>
    <!-- TGBT -->
    <rect x="620" y="250" width="140" height="150"/>
    <line x1="520" y1="325" x2="620" y2="325"/>
    <!-- départs -->
    <line x1="760" y1="270" x2="820" y2="270"/><line x1="760" y1="300" x2="820" y2="300"/><line x1="760" y1="330" x2="820" y2="330"/><line x1="760" y1="360" x2="820" y2="360"/><line x1="760" y1="390" x2="820" y2="390"/>
    <!-- 24V -->
    <rect x="620" y="460" width="140" height="60"/>
    <line x1="690" y1="400" x2="690" y2="460"/>
    <line x1="760" y1="490" x2="820" y2="490"/>
  </g>
  <g font-size="12">
    <text x="125" y="98" text-anchor="middle" font-weight="bold">Champ photovoltaïque</text>
    <text x="125" y="116" text-anchor="middle">6 x 550 Wc = 3,3 kWc</text><text x="125" y="132" text-anchor="middle">(12 x 550 Wc = 6,6 kWc)</text>
    <text x="125" y="210" text-anchor="middle">Coffret DC</text><text x="125" y="226" text-anchor="middle" font-size="10">fusibles, sectionneur, parafoudre</text>
    <text x="410" y="300" text-anchor="middle" font-weight="bold">Onduleur hybride</text>
    <text x="410" y="320" text-anchor="middle">5 kW (8 kW)</text><text x="410" y="338" text-anchor="middle" font-size="11">MPPT, chargeur, entrées réseau et groupe</text><text x="410" y="356" text-anchor="middle" font-size="11">Modbus vers AUT-E</text>
    <text x="410" y="478" text-anchor="middle" font-weight="bold">Batterie LiFePO4 48 V</text><text x="410" y="498" text-anchor="middle">10,2 kWh (20,5 kWh), BMS communicant</text>
    <text x="115" y="356" text-anchor="middle" font-weight="bold">Réseau SNEL</text><text x="115" y="374" text-anchor="middle" font-size="11">compteur, parafoudre T1+T2</text>
    <text x="115" y="456" text-anchor="middle" font-weight="bold">Groupe de secours</text><text x="115" y="474" text-anchor="middle" font-size="11">existant (5 kVA), démarrage auto</text>
    <text x="690" y="275" text-anchor="middle" font-weight="bold">TGBT</text><text x="690" y="293" text-anchor="middle" font-size="11">disjoncteur général</text><text x="690" y="309" text-anchor="middle" font-size="11">différentiels 30 mA</text><text x="690" y="325" text-anchor="middle" font-size="11">contacteurs de délestage</text><text x="690" y="341" text-anchor="middle" font-size="11">par priorité</text>
    <text x="828" y="274">P0 : automates, réseau, aération bassins</text>
    <text x="828" y="304">P1 : irrigation, UV, brassage, stockage, moteurs</text>
    <text x="828" y="334">P2 : chambre froide, extracteurs, pad, refroidisseur</text>
    <text x="828" y="364">P3 : LED germination, osmoseur, divers</text>
    <text x="828" y="394">Secours : aérotherme 3 kW (réseau ou groupe seulement)</text>
    <text x="690" y="485" text-anchor="middle" font-weight="bold">Alimentation 24 V</text><text x="690" y="503" text-anchor="middle" font-size="11">secourue, indépendante</text>
    <text x="828" y="494">automates, capteurs, routeur, surpresseur de secours</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="40" y="570">Terre : boucle en cuivre nu 35 mm² en fond de fouille + piquets, R &lt; 10 Ω ; liaison équipotentielle de la structure de serre, des supports de panneaux, des cuves et armoires.</text>
    <text x="40" y="590">Paratonnerre sur mât dédié ; parafoudres sur DC, AC, RS485 extérieur et Ethernet. Tous les équipements en serre en IP65 minimum.</text>
  </g>
</svg>
