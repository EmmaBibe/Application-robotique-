<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="1000" height="640" fill="#ffffff"/>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#333"/></marker></defs>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold">Schéma hydraulique de principe : trois circuits qui ne se mélangent jamais</text>
  <g stroke-width="3" fill="none" marker-end="url(#f)">
    <path d="M150,130 L150,180" stroke="#2c6ea3"/>
    <path d="M150,260 L150,300 L300,300" stroke="#2c6ea3"/>
    <path d="M90,90 L130,90" stroke="#2c6ea3"/>
    <path d="M360,300 L430,300" stroke="#2c6ea3"/>
    <path d="M520,300 L560,300 L560,150 L620,150" stroke="#2c6ea3"/>
    <path d="M520,300 L560,300 L560,450 L620,450" stroke="#2c6ea3"/>
    <path d="M520,300 L560,300 L560,590 L620,590" stroke="#2c6ea3"/>
    <path d="M720,150 L790,150" stroke="#c0392b"/>
    <path d="M880,190 L880,250 L760,250 L760,215" stroke="#7a5a1e"/>
    <path d="M720,450 L790,450" stroke="#2f7d4f"/>
    <path d="M790,480 L720,480" stroke="#2f7d4f"/>
    <path d="M720,590 L790,590" stroke="#2c6ea3"/>
  </g>
  <g fill="#fff" stroke="#333" stroke-width="1.5">
    <rect x="20" y="60" width="70" height="60" rx="6"/>
    <rect x="100" y="60" width="130" height="70" rx="6"/>
    <rect x="100" y="180" width="100" height="80" rx="6"/>
    <rect x="300" y="275" width="60" height="50" rx="6"/>
    <rect x="430" y="270" width="90" height="60" rx="6"/>
    <rect x="620" y="110" width="100" height="80" rx="6" stroke="#c0392b"/>
    <rect x="790" y="110" width="180" height="80" rx="6" stroke="#c0392b"/>
    <rect x="700" y="195" width="120" height="40" rx="6" stroke="#7a5a1e"/>
    <rect x="620" y="420" width="100" height="80" rx="6" stroke="#2f7d4f"/>
    <rect x="790" y="410" width="180" height="100" rx="6" stroke="#2f7d4f"/>
    <rect x="620" y="560" width="100" height="60" rx="6" stroke="#2c6ea3"/>
    <rect x="790" y="560" width="180" height="60" rx="6" stroke="#2c6ea3"/>
  </g>
  <g text-anchor="middle">
    <text x="55" y="85">Toiture</text><text x="55" y="101" font-size="10">eau de pluie</text>
    <text x="165" y="88">Filtre + 1er flot</text><text x="165" y="104" font-size="10">rejet des 50 premiers L</text>
    <text x="150" y="212">Citerne</text><text x="150" y="228">10 m³ (20 m³)</text>
    <text x="330" y="304">Forage</text><text x="330" y="318" font-size="10">ou réseau</text>
    <text x="475" y="292">Traitement</text><text x="475" y="306" font-size="10">50 µm + charbon</text><text x="475" y="320" font-size="10">(+ osmoseur)</text>
    <text x="670" y="140" font-weight="bold">Cuve fruits</text><text x="670" y="156">500 L</text><text x="670" y="172" font-size="10">dosage A/B/acide</text>
    <text x="880" y="135" font-weight="bold">Seaux hollandais</text><text x="880" y="152">goutte-à-goutte 2 L/h</text><text x="880" y="168" font-size="10">balance de drainage</text>
    <text x="760" y="212" font-size="11">Drainage 200 L</text><text x="760" y="227" font-size="10">filtre 50 µm + UV-C</text>
    <text x="670" y="450" font-weight="bold">Dosage feuilles</text><text x="670" y="466" font-size="10">A/B/acide par bassin</text>
    <text x="880" y="440" font-weight="bold">Bassins à radeaux</text><text x="880" y="457">2 x 4,2 m³, aération</text><text x="880" y="474" font-size="10">filtration + UV en dérivation</text><text x="880" y="490" font-size="10">refroidisseur sur bassin frais</text>
    <text x="670" y="586" font-weight="bold">Bac du pad</text><text x="670" y="602" font-size="10">300 L, purge</text>
    <text x="880" y="586" font-weight="bold">Murs évaporatifs</text><text x="880" y="602" font-size="10">eau de pluie en priorité</text>
  </g>
  <g font-size="12">
    <rect x="30" y="360" width="470" height="150" rx="8" fill="#f7f7f7" stroke="#ccc"/>
    <text x="45" y="385" font-weight="bold">Règles</text>
    <text x="45" y="405">Circuit fruits (rouge) et circuit feuilles (vert) physiquement séparés.</text>
    <text x="45" y="423">Drainage des fruits recyclé après filtration et UV-C.</text>
    <text x="45" y="441">Cuves et tuyaux opaques, qualité alimentaire, sans cuivre ni laiton.</text>
    <text x="45" y="459">Clapets anti-retour avant chaque injection, vannes d'isolement.</text>
    <text x="45" y="477">Purge partielle vers la fosse de valorisation si Na ou CE trop élevés.</text>
    <text x="45" y="495">Repérage couleur : bleu eau traitée, rouge fruits, vert feuilles, marron drainage.</text>
  </g>
</svg>
