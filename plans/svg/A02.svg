<text x="250.00" y="34.20" font-size="2.1" text-anchor="start" fill="#1a1a1a">Surfaces :</text>
<text x="250.00" y="37.25" font-size="2.1" text-anchor="start" fill="#1a1a1a">  serre 100 m² (fruits 50, feuilles 50) ; radeaux 33,6 m² ;</text>
<text x="250.00" y="40.29" font-size="2.1" text-anchor="start" fill="#1a1a1a">  annexe 30 m² ; sas 3 m².</text>
<text x="250.00" y="43.34" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="250.00" y="46.38" font-size="2.1" text-anchor="start" fill="#1a1a1a">Sol de la serre : plateforme compactée, géotextile, gravier 10 cm,</text>
<text x="250.00" y="49.43" font-size="2.1" text-anchor="start" fill="#1a1a1a">toile tissée blanche ; allée et bordures de bassins en béton dosé</text>
<text x="250.00" y="52.47" font-size="2.1" text-anchor="start" fill="#1a1a1a">à 350 kg/m³, épaisseur 10 cm, treillis ST 25.</text>
<text x="250.00" y="55.52" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="250.00" y="58.56" font-size="2.1" text-anchor="start" fill="#1a1a1a">Bassins semi-enterrés de 20 cm, isolés en périphérie (XPS 40 mm),</text>
<text x="250.00" y="61.61" font-size="2.1" text-anchor="start" fill="#1a1a1a">liner EPDM 1 mm, traitement anti-termites sous dalle.</text>
<text x="250.00" y="64.65" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="250.00" y="67.70" font-size="2.1" text-anchor="start" fill="#1a1a1a">Annexe : ossature acier et panneaux isolants (optimisée) ou blocs</text>
<text x="250.00" y="70.74" font-size="2.1" text-anchor="start" fill="#1a1a1a">de ciment enduits (complète) ; toiture monopente à 12° vers le</text>
<text x="250.00" y="73.78" font-size="2.1" text-anchor="start" fill="#1a1a1a">nord portant les panneaux solaires ; pépinière sous polycarbonate.</text>
<text x="250.00" y="76.83" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="250.00" y="79.88" font-size="2.1" text-anchor="start" fill="#1a1a1a">Circulations : jeunes plants -&gt; feuilles -&gt; fruits (biosécurité) ;</text>
<text x="250.00" y="82.92" font-size="2.1" text-anchor="start" fill="#1a1a1a">récoltes par le passe-plat du sas vers le conditionnement.</text>
