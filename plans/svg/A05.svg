<text x="218.00" y="36.00" font-size="3" text-anchor="middle" fill="#1a1a1a" font-weight="700">N</text>
<text x="242.00" y="40.00" font-size="2.6" text-anchor="start" fill="#1a1a1a" font-weight="700">Notes</text>
<text x="242.00" y="44.20" font-size="2.1" text-anchor="start" fill="#1a1a1a">Principes :</text>
<text x="242.00" y="47.25" font-size="2.1" text-anchor="start" fill="#1a1a1a">- serres au nord de la parcelle, bâtiments bas au sud : à 11,7° de latitude sud,</text>
<text x="242.00" y="50.29" font-size="2.1" text-anchor="start" fill="#1a1a1a">  le soleil passe au nord du zénith dix mois sur douze ; aucun bâtiment ne fait</text>
<text x="242.00" y="53.34" font-size="2.1" text-anchor="start" fill="#1a1a1a">  d&#x27;ombre aux serres ;</text>
<text x="242.00" y="56.38" font-size="2.1" text-anchor="start" fill="#1a1a1a">- faîtages est-ouest, murs évaporatifs à l&#x27;est (vents de saison sèche E-SE) ;</text>
<text x="242.00" y="59.43" font-size="2.1" text-anchor="start" fill="#1a1a1a">- 3 m de bande sanitaire en gravier entre les blocs, 4 m entre la tranche 2</text>
<text x="242.00" y="62.47" font-size="2.1" text-anchor="start" fill="#1a1a1a">  et le pilote ;</text>
<text x="242.00" y="65.52" font-size="2.1" text-anchor="start" fill="#1a1a1a">- le bâtiment aquacole touche l&#x27;annexe : accès unique par le sas, local à</text>
<text x="242.00" y="68.56" font-size="2.1" text-anchor="start" fill="#1a1a1a">  aliment et salle de préparation du poisson partagés avec le conditionnement ;</text>
<text x="242.00" y="71.61" font-size="2.1" text-anchor="start" fill="#1a1a1a">- l&#x27;eau des bacs part vers les serres par une canalisation enterrée (PE 40)</text>
<text x="242.00" y="74.65" font-size="2.1" text-anchor="start" fill="#1a1a1a">  qui longe le pilote puis la tranche 2 (planche H04) ;</text>
<text x="242.00" y="77.70" font-size="2.1" text-anchor="start" fill="#1a1a1a">- la tranche 3 et sa part de panneaux ne sont construites qu&#x27;après décision</text>
<text x="242.00" y="80.74" font-size="2.1" text-anchor="start" fill="#1a1a1a">  (chapitre 16) ; leur emplacement reste libre et gravillonné.</text>
<text x="242.00" y="83.78" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="242.00" y="86.83" font-size="2.1" text-anchor="start" fill="#1a1a1a">Surfaces :</text>
<text x="242.00" y="89.88" font-size="2.1" text-anchor="start" fill="#1a1a1a">- parcelle 4 800 m² ; serres 1 993 m² ; bâtiments 180 m² ;</text>
<text x="242.00" y="92.92" font-size="2.1" text-anchor="start" fill="#1a1a1a">- panneaux au sol 220 m² (en plus des panneaux du pilote sur l&#x27;annexe) ;</text>
<text x="242.00" y="95.97" font-size="2.1" text-anchor="start" fill="#1a1a1a">- voiries et aires 500 m² ; bandes sanitaires et réserves le reste.</text>
