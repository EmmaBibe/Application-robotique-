<text x="235.00" y="40.00" font-size="2.6" text-anchor="start" fill="#1a1a1a" font-weight="700">Notes</text>
<text x="235.00" y="44.20" font-size="2.1" text-anchor="start" fill="#1a1a1a">Implantation :</text>
<text x="235.00" y="47.25" font-size="2.1" text-anchor="start" fill="#1a1a1a">- faîtage de la serre orienté est-ouest ; murs évaporatifs au pignon est</text>
<text x="235.00" y="50.29" font-size="2.1" text-anchor="start" fill="#1a1a1a">  (vents dominants de saison sèche E - SE), extracteurs au pignon ouest ;</text>
<text x="235.00" y="53.34" font-size="2.1" text-anchor="start" fill="#1a1a1a">- annexe au sud, à 2 m : ombre portée nulle sur la serre (soleil au</text>
<text x="235.00" y="56.38" font-size="2.1" text-anchor="start" fill="#1a1a1a">  nord du zénith dix mois sur douze ; 78° au plus bas vers le sud) ;</text>
<text x="235.00" y="59.43" font-size="2.1" text-anchor="start" fill="#1a1a1a">- bande sanitaire de 3 m en gravier nu autour de la serre ;</text>
<text x="235.00" y="62.47" font-size="2.1" text-anchor="start" fill="#1a1a1a">- aucun arbre ni bâtiment haut à moins de 20 m au N, à l&#x27;E et à l&#x27;O ;</text>
<text x="235.00" y="65.52" font-size="2.1" text-anchor="start" fill="#1a1a1a">- pas de culture de solanacées ni de crucifères à moins de 50 m.</text>
<text x="235.00" y="68.56" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="235.00" y="71.61" font-size="2.1" text-anchor="start" fill="#1a1a1a">Réseaux enterrés : eau (PE-HD 32), câble SNEL (U1000R2V sous fourreau</text>
<text x="235.00" y="74.65" font-size="2.1" text-anchor="start" fill="#1a1a1a">TPC rouge Ø 63), boucle de terre en fond de fouille, pluvial vers</text>
<text x="235.00" y="77.70" font-size="2.1" text-anchor="start" fill="#1a1a1a">citerne et puits d&#x27;infiltration ; profondeur 0,6 m minimum.</text>
<text x="235.00" y="80.74" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="235.00" y="83.78" font-size="2.1" text-anchor="start" fill="#1a1a1a">Terrain : plateforme compactée, pente 1 % vers l&#x27;ouest ;</text>
<text x="235.00" y="86.83" font-size="2.1" text-anchor="start" fill="#1a1a1a">élimination des termitières dans un rayon de 20 m.</text>
