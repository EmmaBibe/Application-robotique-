<text x="180.00" y="158.00" font-size="2.0" text-anchor="middle" fill="#1a1a1a" font-weight="700">Mât paratonnerre 9 m</text>
<line x1="180.00" y1="153.00" x2="156.00" y2="168.00" stroke="#2e7d32" stroke-width="0.8"/>
<text x="174.00" y="166.00" font-size="1.8" text-anchor="start" fill="#2e7d32">descente dédiée</text>
<text x="200.00" y="45.00" font-size="2.6" text-anchor="start" fill="#1a1a1a" font-weight="700">Prescriptions</text>
<text x="200.00" y="49.20" font-size="2.1" text-anchor="start" fill="#1a1a1a">Prise de terre :</text>
<text x="200.00" y="52.25" font-size="2.1" text-anchor="start" fill="#1a1a1a">- boucle en câble cuivre nu 35 mm² en fond de fouille, à 0,6 m de profondeur,</text>
<text x="200.00" y="55.29" font-size="2.1" text-anchor="start" fill="#1a1a1a">  autour de la serre et de l&#x27;annexe ; 4 piquets de 2 m en acier cuivré (P) ;</text>
<text x="200.00" y="58.34" font-size="2.1" text-anchor="start" fill="#1a1a1a">- résistance visée &lt; 10 ohms, mesurée à la réception (méthode des 62 %) ;</text>
<text x="200.00" y="61.38" font-size="2.1" text-anchor="start" fill="#1a1a1a">- barrette de coupure dans le local technique pour les mesures.</text>
<text x="200.00" y="64.42" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="200.00" y="67.47" font-size="2.1" text-anchor="start" fill="#1a1a1a">Liaisons équipotentielles (cuivre 16 mm² vert-jaune) :</text>
<text x="200.00" y="70.52" font-size="2.1" text-anchor="start" fill="#1a1a1a">- structure acier de la serre (aux 4 angles), structure des panneaux PV,</text>
<text x="200.00" y="73.56" font-size="2.1" text-anchor="start" fill="#1a1a1a">- cuves et canalisations métalliques, armoires, onduleur (borne PE),</text>
<text x="200.00" y="76.61" font-size="2.1" text-anchor="start" fill="#1a1a1a">- station météo et mât des antennes 4G.</text>
<text x="200.00" y="79.65" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="200.00" y="82.70" font-size="2.1" text-anchor="start" fill="#1a1a1a">Protection foudre :</text>
<text x="200.00" y="85.74" font-size="2.1" text-anchor="start" fill="#1a1a1a">- paratonnerre à tige simple sur mât de 9 m, rayon de protection selon</text>
<text x="200.00" y="88.78" font-size="2.1" text-anchor="start" fill="#1a1a1a">  la méthode de la sphère fictive (niveau III, R = 45 m) : serre et annexe couvertes ;</text>
<text x="200.00" y="91.83" font-size="2.1" text-anchor="start" fill="#1a1a1a">- descente séparée, raccordée à la boucle par une liaison équipotentielle</text>
<text x="200.00" y="94.88" font-size="2.1" text-anchor="start" fill="#1a1a1a">  via éclateur au droit de l&#x27;onduleur ;</text>
<text x="200.00" y="97.92" font-size="2.1" text-anchor="start" fill="#1a1a1a">- parafoudres : T1+T2 en tête SNEL, T2 en tête TGBT, T2 DC 600 V côté PV,</text>
<text x="200.00" y="100.97" font-size="2.1" text-anchor="start" fill="#1a1a1a">  protections de ligne sur RS485 extérieur, Ethernet et antennes.</text>
<text x="200.00" y="104.01" font-size="2.1" text-anchor="start" fill="#1a1a1a"></text>
<text x="200.00" y="107.06" font-size="2.1" text-anchor="start" fill="#1a1a1a">Contrôles : mesure de terre annuelle (avant la saison des pluies),</text>
<text x="200.00" y="110.10" font-size="2.1" text-anchor="start" fill="#1a1a1a">inspection des parafoudres après chaque orage violent (voyant d&#x27;état).</text>
