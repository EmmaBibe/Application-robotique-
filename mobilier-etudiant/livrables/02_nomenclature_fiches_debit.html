<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomenclature et fiches de débit</title>
<style>
@page { size: A4 portrait; margin: 14mm 14mm 16mm 14mm; }
@page paysage { size: A4 landscape; margin: 9mm 10mm 12mm 10mm; }
:root { --texte: #1d2126; --doux: #5b636c; --ligne: #c9ccd0; --fond: #f3f1ec; --accent: #c4581f; --bleu: #1b4f7a; }
* { box-sizing: border-box; }
html { background: #e9e7e2; }
body { margin: 0 auto; max-width: 210mm; background: #fff; color: var(--texte); font: 9.6pt/1.42 "Segoe UI", Arial, Helvetica, sans-serif; padding: 14mm; }
@media print { html { background: #fff; } body { max-width: none; padding: 0; } }
h1 { font-size: 20pt; margin: 0 0 4mm; line-height: 1.15; }
h2 { font-size: 13.5pt; margin: 7mm 0 2.5mm; padding-bottom: 1.2mm; border-bottom: 1.4pt solid var(--texte); break-after: avoid; }
h3 { font-size: 11pt; margin: 5mm 0 1.8mm; break-after: avoid; color: var(--bleu); }
h4 { font-size: 9.8pt; margin: 3.5mm 0 1.2mm; break-after: avoid; }
p { margin: 1.4mm 0; }
ul, ol { margin: 1.2mm 0 1.6mm; padding-left: 5.5mm; }
li { margin: 0.6mm 0; }
table { border-collapse: collapse; width: 100%; margin: 2mm 0 3mm; font-size: 8.4pt; break-inside: auto; }
thead { display: table-header-group; }
tr { break-inside: avoid; }
th, td { border: 0.5pt solid var(--ligne); padding: 1.1mm 1.6mm; text-align: left; vertical-align: top; }
th { background: var(--fond); font-weight: 600; }
td.n, th.n { text-align: right; white-space: nowrap; }
td.c, th.c { text-align: center; }
.ok { color: #1e7a3c; font-weight: 600; }
.ko { color: #b3261e; font-weight: 600; }
.note { background: var(--fond); border-left: 2.5pt solid var(--accent); padding: 2mm 3mm; margin: 2.5mm 0; break-inside: avoid; }
.note.bleu { border-left-color: var(--bleu); }
.petit { font-size: 8pt; color: var(--doux); }
.saut { break-before: page; }
.couverture { height: 262mm; display: flex; flex-direction: column; break-after: page; }
.couverture .bandeau { border-top: 5pt solid var(--texte); padding-top: 6mm; }
.couverture .sur { text-transform: uppercase; letter-spacing: 1.5pt; font-size: 9pt; color: var(--doux); }
.couverture h1 { font-size: 26pt; margin-top: 3mm; }
.couverture .sous { font-size: 13pt; color: var(--doux); margin-bottom: 6mm; }
.couverture img { width: 100%; border: 0.5pt solid var(--ligne); margin: 4mm 0; }
.couverture .pied { margin-top: auto; }
.couverture table td { font-size: 9pt; }
.sommaire ol { columns: 2; column-gap: 8mm; }
.paysage { page: paysage; break-before: page; }
.feuille { position: relative; width: 277mm; height: 186mm; break-after: page; overflow: hidden; }
.feuille:last-child { break-after: auto; }
.feuille h2 { margin-top: 0; font-size: 12pt; }
.feuille .vues { display: flex; gap: 6mm; align-items: flex-end; flex-wrap: nowrap; }
.feuille figure { margin: 0; }
.feuille figcaption, figure.detail figcaption { font-size: 8pt; color: var(--doux); margin-top: 1mm; }
.cartouche { position: absolute; right: 0; bottom: 0; border: 0.8pt solid var(--texte); font-size: 7.4pt; width: 98mm; background: #fff; }
.cartouche table { margin: 0; font-size: 7.4pt; }
.cartouche td { border: 0.4pt solid var(--texte); padding: 0.6mm 1.4mm; }
.cartouche .t { font-weight: 700; font-size: 9pt; }
.legende { font-size: 7.6pt; color: var(--doux); }
.legende span { display: inline-block; width: 3mm; height: 3mm; vertical-align: -0.5mm; margin: 0 1mm 0 3mm; border: 0.4pt solid #444; }
.details { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm 6mm; }
figure.detail { margin: 0; break-inside: avoid; }
.etape { display: grid; grid-template-columns: 92mm 1fr; gap: 4mm; padding: 2.5mm 0; border-top: 0.5pt solid var(--ligne); break-inside: avoid; }
.etape img { width: 92mm; border: 0.5pt solid var(--ligne); display: block; }
.etape h4 { margin-top: 0; }
.etape .num { display: inline-block; background: var(--accent); color: #fff; border-radius: 2mm; padding: 0 1.6mm; margin-right: 1.5mm; font-size: 8.6pt; }
.etape ul.ctrl { list-style: none; padding-left: 0; }
.etape ul.ctrl li::before { content: "☐ "; color: var(--accent); }
.barres svg, .calepin svg { display: block; margin: 1mm 0 2.5mm; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
.img-pleine { width: 100%; border: 0.5pt solid var(--ligne); }
.cle { font-weight: 600; }
td.vide { background: repeating-linear-gradient(90deg, #fff 0 4mm, #fafafa 4mm 8mm); }
</style>
</head>
<body>
<div id="contenu">Préparation du document…</div>
<script>window.TYPE_DOC = 'debit';</script>
<script>
/*
 * Modèle paramétrique des trois meubles.
 * Toutes les cotes sont en millimètres.
 * Repère : x = largeur (gauche -> droite vu de face), y = profondeur (0 = face avant, vers le mur),
 *          z = hauteur (0 = sol, ou dessous du meuble pour l'étagère murale).
 *
 * Ce fichier est la seule source des dimensions : la simulation 3D, les plans, la liste de débit
 * et la notice sont tous recalculés à partir de lui. Pour modifier une cote, on la modifie ici
 * puis on relance  node outils/construire.js
 */
(function (root) {
  'use strict';

  /* ------------------------------------------------------------------ */
  /*  Sections et matières                                               */
  /* ------------------------------------------------------------------ */
  const SECTIONS = {
    T20: { nom: 'Tube carré 20×20×1,5', type: 'carre', a: 20, t: 1.5, barre: 6000 },
    T25: { nom: 'Tube carré 25×25×1,5', type: 'carre', a: 25, t: 1.5, barre: 6000 },
    R25: { nom: 'Tube rond Ø25×1,5 (inox ou chromé)', type: 'rond', d: 25, t: 1.5, barre: 3000 },
    R20: { nom: 'Tube rond Ø20×1,2 (tringle à rideau)', type: 'rond', d: 20, t: 1.2, barre: 3000 },
    RP6: { nom: 'Rond plein Ø6', type: 'plein', d: 6, barre: 3000 },
    P20x3: { nom: 'Plat 20×3', type: 'plat', b: 20, e: 3, barre: 6000 },
    P25x3: { nom: 'Plat 25×3', type: 'plat', b: 25, e: 3, barre: 6000 },
    P25x4: { nom: 'Plat 25×4', type: 'plat', b: 25, e: 4, barre: 6000 },
    P30x3: { nom: 'Plat 30×3', type: 'plat', b: 30, e: 3, barre: 6000 },
    P30x4: { nom: 'Plat 30×4', type: 'plat', b: 30, e: 4, barre: 6000 },
    P40x4: { nom: 'Cornière 40×40×4', type: 'corniere', b: 40, e: 4, barre: 6000 }
  };

  const COUL = {
    acierA: '#3c434b', acierB: '#2b2e33', acierC: '#3c434b',
    platine: '#8d959e', cp15: '#dcbc8c', cp18: '#d2a873', cp5: '#e3c9a0',
    inox: '#c3cad0', galva: '#aeb6bd', alu: '#d5d9dd',
    rideau: '#7d9a8c', mur: '#ece8e1', sol1: '#d9d4cb', sol2: '#cfc9be',
    verin: '#222222', noir: '#1d1f22'
  };

  /* Hypothèses sur les appareils et objets rangés (à vérifier sur les modèles réels) */
  const HYP = {
    bouteille: { d: 250, hCorps: 310, hCol: 60, masse: 12, txt: 'Bouteille de gaz 5 kg : Ø 250 mm, hauteur 370 mm col compris, environ 12 kg pleine' },
    bruleur: { h: 85, dSupport: 330, txt: 'Brûleur sur bouteille + support de casserole aluminium : +85 mm au-dessus du col, support Ø 330 mm' },
    induction: { L: 290, P: 360, H: 65, w: 2000, txt: 'Plaque induction BOMA monoplace : 290 × 360 × 65 mm, 2000 W' },
    rechaud: { L: 270, P: 260, H: 85, foyer: 185, w: 1500, txt: 'Réchaud électrique monoplace : 270 × 260 × 85 mm, foyer fonte Ø 185, 1000 à 1500 W' },
    casserole: { d: 280, txt: 'Casserole / marmite maximale : Ø 280 × 180 mm' },
    assiette: { d: 265, txt: 'Assiettes plates : Ø 265 mm maximum' },
    bouteilles: { d: 90, h: 330, txt: 'Bouteilles 1,5 L : Ø 90 × 330 mm ; huile 1 L : Ø 80 × 300 mm' },
    verres: { txt: 'Verre à eau Ø 75 × 120 ; verre à bière Ø 80 × 200 ; verre à whisky Ø 82 × 95 ; tasse Ø 85 × 95 ; gobelet Ø 75 × 110 (mm)' }
  };

  /* ------------------------------------------------------------------ */
  /*  Outils de construction                                             */
  /* ------------------------------------------------------------------ */
  function box(x, y, z, dx, dy, dz) { return { t: 'box', x, y, z, dx, dy, dz }; }
  function cyl(ax, x, y, z, r, h, n) { return { t: 'cyl', ax, x, y, z, r, h, n: n || 20 }; }

  function Constructeur(code, opts) {
    this.code = code;
    this.parts = [];
    this.cur = { etape: 0, module: 0 };
    this.typesCadre = [];
    this.quinc = {};
    this.coulAcier = opts.coulAcier;
    this.notesUsinage = [];
  }
  Constructeur.prototype.set = function (o) { Object.assign(this.cur, o); return this; };
  Constructeur.prototype.add = function (p) {
    if (p.etape === undefined) p.etape = this.cur.etape;
    if (p.module === undefined) p.module = this.cur.module;
    if (!p.formes) p.formes = [p.forme];
    delete p.forme;
    this.parts.push(p);
    return p;
  };
  Constructeur.prototype.q = function (cle, n, designation, usage) {
    if (!this.quinc[cle]) this.quinc[cle] = { cle, designation, qte: 0, usages: [] };
    this.quinc[cle].qte += n;
    if (usage && this.quinc[cle].usages.indexOf(usage) < 0) this.quinc[cle].usages.push(usage);
  };

  /* Type de cadre soudé (échelle) : deux montants + traverses de profondeur.
     Les cadres sont percés et sertis sur leurs DEUX faces latérales : un même cadre se monte
     indifféremment à gauche ou à droite d'un module. */
  Constructeur.prototype.typeCadre = function (code, d) {
    const ft = Object.assign({ code, inst: 0, trous: { av: {}, ar: {} }, traversants: {}, faceAvant: {} }, d);
    this.typesCadre.push(ft);
    return ft;
  };
  function ajTrou(ft, cote, z, filet, usage) {
    const k = String(Math.round(z * 10) / 10);
    ft.trous[cote][k] = { z, filet, usage };
  }

  Constructeur.prototype.cadre = function (ft, x, z0, mod) {
    const S = SECTIONS[ft.sec], a = S.a, D = ft.D;
    ft.inst++;
    const sousEns = ft.nom;
    const inst = { ft, x, z0, a, D, mod };
    // montants
    inst.mAv = this.add({
      nom: 'Montant avant', cat: 'tube', sousEns, couleur: this.coulAcier,
      debit: { sec: ft.sec, L: ft.Hf, coupe: '90° / 90°', _ft: ft, _cote: 'av' },
      forme: box(x, 0, z0, a, a, ft.Hf), module: mod
    });
    inst.mAr = this.add({
      nom: ft.Hb > ft.Hf ? 'Montant arrière (rehaussé)' : 'Montant arrière', cat: 'tube', sousEns, couleur: this.coulAcier,
      debit: { sec: ft.sec, L: ft.Hb, coupe: '90° / 90°', _ft: ft, _cote: 'ar' },
      forme: box(x, D - a, z0, a, a, ft.Hb), module: mod
    });
    // traverses de profondeur (soudées entre montants)
    ft.traverses.forEach(tr => {
      let us = '';
      if (tr.us === 'tab') us = '2 × (Ø4,5 dessus / Ø8 dessous) pour vis de tablette';
      if (tr.us === 'tringle') us = '2 × écrou à sertir M5 sur chaque face latérale (support de tringle)';
      this.add({
        nom: tr.nom || 'Traverse de profondeur', cat: 'tube', sousEns, couleur: this.coulAcier,
        debit: { sec: ft.sec, L: D - 2 * a, coupe: '90° / 90° (à souder entre montants)', usin: us },
        forme: box(x, a, z0 + tr.z - a, a, D - 2 * a, a), module: mod
      });
    });
    // vérins ou bouchons
    if (ft.verins) {
      [inst.mAv, inst.mAr].forEach((m, i) => {
        this.add({ nom: 'Vérin de nivellement M8', cat: 'quinc', couleur: COUL.verin, info: 'Embout taraudé M8 enfoncé dans le tube, patin Ø30 réglable de 15 à 30 mm',
          forme: cyl('z', x + a / 2, (i === 0 ? a / 2 : D - a / 2), 0, 15, z0, 14), module: mod });
      });
      this.q('verin', 2, 'Vérin de nivellement M8, patin Ø30 + embout taraudé carré ' + a + '×' + a, 'pieds');
    }
    this.q('bouchon' + a, ft.verins ? 2 : 4, 'Bouchon plastique à ailettes ' + a + '×' + a, 'extrémités des montants');
    return inst;
  };

  /* Lisse (traverse de largeur) boulonnée entre deux cadres d'un même module, platines soudées aux extrémités */
  Constructeur.prototype.lisse = function (cG, cD, cote, zc, nb, nom, extraUsin) {
    const ft = cG.ft, a = cG.a, D = cG.D;
    const S = SECTIONS[ft.sec];
    const e = 3;                                 // épaisseur platine
    const filet = a === 25 ? 'M6' : 'M5';
    const xa = cG.x + a + e, xb = cD.x - e;
    const y = cote === 'av' ? 0 : D - a;
    const z0 = cG.z0;
    // nb = 2 : deux boulons de part et d'autre du tube ; 1 : un boulon au-dessus ; 'b' : un boulon au-dessous
    // (lisse affleurant le haut du cadre)
    let hp, trous, zp0;
    if (nb === 2) { hp = a === 25 ? 60 : 50; const ec = a === 25 ? 21 : 18; trous = [zc - ec, zc + ec]; zp0 = zc - hp / 2; }
    else if (nb === 1) { hp = 40; trous = [zc + 20]; zp0 = zc - a / 2; }
    else { hp = a === 25 ? 50 : 40; trous = [zc + a / 2 - hp + 11]; zp0 = zc + a / 2 - hp; }
    const nbB = nb === 2 ? 2 : 1;
    const L = Math.round(xb - xa);
    const sousEns = 'Lisse ' + L + ' (' + nbB + ' boulon' + (nbB > 1 ? 's' : '') + ' par extrémité)';
    const p = this.add({
      nom: nom, cat: 'tube', sousEns, couleur: this.coulAcier,
      debit: { sec: ft.sec, L, coupe: '90° / 90°', usin: extraUsin || '' },
      forme: box(xa, y, z0 + zc - a / 2, L, a, a)
    });
    const secP = a === 25 ? 'P25x3' : 'P20x3';
    [cG.x + a, xb].forEach(xp => {
      this.add({
        nom: 'Platine d\'about', cat: 'plat', sousEns, couleur: COUL.platine,
        debit: { sec: secP, L: hp, coupe: '90° / 90°', usin: nbB + ' trou' + (nbB > 1 ? 's' : '') + ' Ø' + (a === 25 ? '6,5' : '5,5') + (nb === 2 ? ' entraxe ' + (trous[1] - trous[0]) : (nb === 1 ? ' à 20 mm au-dessus de l\'axe du tube' : ' à 11 mm du bas de la platine')) },
        forme: box(xp, y, z0 + zp0, e, a, hp)
      });
    });
    trous.forEach(z => { ajTrou(ft, cote, z, filet, nom); ajTrou(cD.ft, cote, z, filet, nom); });
    this.q('vis' + filet, 2 * nbB, 'Vis CHC ' + filet + '×16 zinguée + rondelle plate ' + filet, 'lisses boulonnées');
    return p;
  };

  /* Équerre d'ancrage mural 40×40×4 vissée sur la face intérieure d'un montant arrière */
  Constructeur.prototype.equerre = function (c, faceX, z, murY) {
    const a = c.a, D = c.D;
    const filet = a === 25 ? 'M6' : 'M5';
    const xf = faceX === 'g' ? c.x + a : c.x;          // face intérieure côté module
    const sens = faceX === 'g' ? 1 : -1;
    const ep = 4, larg = 30;
    const y1 = murY - 40;
    const f1 = box(sens > 0 ? xf : xf - ep, y1, c.z0 + z - larg / 2, ep, murY - ep - y1, larg);
    const f2 = box(sens > 0 ? xf : xf - 40, murY - ep, c.z0 + z - larg / 2, 40, ep, larg);
    this.add({
      nom: 'Équerre d\'ancrage mural', cat: 'plat', couleur: COUL.platine, sousEns: null,
      debit: { sec: 'P40x4', L: larg, coupe: '90° / 90°', usin: 'aile meuble : 1 trou Ø' + (a === 25 ? '6,5' : '5,5') + ' ; aile mur : 1 trou oblong 8,5 × 20' },
      info: 'Fixation au mur par cheville Ø8 (voir tableau des chevilles selon le support)',
      formes: [f1, f2]
    });
    ajTrou(c.ft, 'ar', z, filet, 'équerre murale');
    this.q('vis' + filet, 1, 'Vis CHC ' + filet + '×16 zinguée + rondelle plate ' + filet, 'équerres murales');
    this.q('cheville', 1, 'Cheville Ø8 adaptée au mur + vis Ø5×50 tête hexagonale + rondelle', 'ancrage mural');
  };

  /* Liaison entre deux modules voisins : boulons traversants */
  Constructeur.prototype.liaison = function (cD, cG2, zs) {
    const a = cD.a;
    const filet = a === 25 ? 'M6' : 'M5';
    [['av', 0], ['ar', cD.D - a]].forEach(([cote, y]) => {
      zs.forEach(z => {
        if ((cote === 'av' ? cD.ft.Hf : cD.ft.Hb) < z || (cote === 'av' ? cG2.ft.Hf : cG2.ft.Hb) < z) return;
        cD.ft.traversants[cote + z] = { cote, z };
        cG2.ft.traversants[cote + z] = { cote, z };
        this.add({ nom: 'Boulon de liaison inter-modules', cat: 'quinc', couleur: COUL.platine,
          info: 'Boulon ' + filet + ' traversant les deux montants accolés, serrage modéré (5 N·m) pour ne pas écraser les tubes',
          formes: [cyl('x', cD.x - 4, y + a / 2, cD.z0 + z, 5, 4, 8), cyl('x', cG2.x + a, y + a / 2, cG2.z0 + z, 5, 5, 6)] });
        this.q('liaison' + filet, 1, 'Boulon TH ' + filet + '×' + (2 * a + 10) + ' + 2 rondelles larges + écrou frein (Nylstop)', 'liaison entre modules');
      });
    });
  };

  /* Calcul final des usinages des montants à partir des trous enregistrés */
  Constructeur.prototype.finaliser = function () {
    this.parts.forEach(p => {
      if (p.debit && p.debit._ft) {
        const ft = p.debit._ft, cote = p.debit._cote;
        const tr = Object.values(ft.trous[cote]).sort((u, v) => u.z - v.z);
        const tv = Object.values(ft.traversants).filter(t => t.cote === cote).sort((u, v) => u.z - v.z);
        const fa = cote === 'av' ? Object.values(ft.faceAvant).sort((u, v) => u.z - v.z) : [];
        const morceaux = [];
        if (tr.length) {
          const filet = tr[0].filet;
          morceaux.push(tr.length * 2 + ' écrous à sertir ' + filet + ' (Ø' + (filet === 'M6' ? 9 : 7) + ', ' + tr.length + ' par face latérale) à z = ' + tr.map(t => Math.round(t.z)).join(' / '));
        }
        if (tv.length) morceaux.push(tv.length + ' trou' + (tv.length > 1 ? 's' : '') + ' traversant' + (tv.length > 1 ? 's' : '') + ' Ø' + (p.debit.sec === 'T25' ? '6,5' : '5,5') + ' à z = ' + tv.map(t => t.z).join(' / '));
        if (fa.length) morceaux.push(fa.length + ' écrou' + (fa.length > 1 ? 's' : '') + ' à sertir M6 face avant à z = ' + fa.map(t => t.z).join(' / ') + ' (' + fa[0].usage + ')');
        p.debit.usin = morceaux.join(' ; ');
        delete p.debit._ft; delete p.debit._cote;
      }
    });
    // écrous à sertir des cadres
    this.typesCadre.forEach(ft => {
      ['av', 'ar'].forEach(cote => {
        const tr = Object.values(ft.trous[cote]);
        if (!tr.length) return;
        const filet = tr[0].filet;
        this.q('sertir' + filet, tr.length * 2 * ft.inst, 'Écrou à sertir ' + filet + ' acier zingué tête plate (perçage Ø' + (filet === 'M6' ? 9 : 7) + ')', 'cadres percés sur les deux faces');
      });
      const fa = Object.values(ft.faceAvant);
      if (fa.length) this.q('sertirM6', fa.length * ft.inst, 'Écrou à sertir M6 acier zingué tête plate (perçage Ø9)', 'pattes de tringle à rideau');
    });
  };

  /* ------------------------------------------------------------------ */
  /*  A. DRESSING MODULAIRE                                              */
  /* ------------------------------------------------------------------ */
  function dressing() {
    const b = new Constructeur('A', { coulAcier: COUL.acierA });
    const a = 25, D = 550, H = 1900, zb = 20, murY = 565;
    const tab = (z) => ({ z, us: 'tab', nom: 'Traverse porte-tablette' });
    const Fp = b.typeCadre('Fp', { nom: 'Cadre soudé Fp (penderie)', sec: 'T25', D, Hf: H, Hb: H, verins: true,
      traverses: [tab(80), tab(330), { z: 1100, nom: 'Traverse de raidissage' }, { z: 1760, us: 'tringle', nom: 'Traverse porte-tringle' }, tab(1900)] });
    const Fe = b.typeCadre('Fe', { nom: 'Cadre soudé Fe (étagères)', sec: 'T25', D, Hf: H, Hb: H, verins: true,
      traverses: [tab(80), tab(330), tab(650), tab(950), tab(1250), tab(1550), tab(1900)] });

    const mods = [
      { code: 'P1', nom: 'Module penderie 1', x: 0, w: 700, ft: Fp },
      { code: 'E', nom: 'Module étagères', x: 700, w: 450, ft: Fe },
      { code: 'P2', nom: 'Module penderie 2', x: 1150, w: 700, ft: Fp }
    ];
    const etapeMod = [[0, 1], [2, 2], [3, 3]];
    mods.forEach((m, i) => {
      b.set({ module: i, etape: etapeMod[i][0] });
      m.cG = b.cadre(m.ft, m.x, zb, i);
      m.cD = b.cadre(m.ft, m.x + m.w - a, zb, i);
      b.set({ etape: etapeMod[i][1] });
      b.lisse(m.cG, m.cD, 'ar', 1852.5, 2, 'Lisse arrière haute');
      b.lisse(m.cG, m.cD, 'av', 1852.5, 2, 'Lisse avant haute');

    return {
      code: 'A', nom: 'Dressing modulaire avec rideaux', court: 'Dressing',

      niveaux: { face: [0, zb, zb + 80, zb + 330, zb + 1100, zb + 1760, zb + H, zb + H + 15], faceE: [zb + 650, zb + 950, zb + 1250, zb + 1550] },
      cotesH: [0, 700, 1150, 1850],
      etapes: [
        { t: 'Module penderie 1 : cadres et vérins', d: 'Visser les 4 vérins M8 sous les deux cadres Fp. Poser les cadres debout, face avant vers soi, à environ 650 mm l\'un de l\'autre. Les écrous à sertir sont présents sur les deux faces : le sens gauche/droite est indifférent.', ctrl: ['Embouts taraudés bien enfoncés', 'Vérins vissés à mi-course (≈ 20 mm)'] },
        { t: 'Module penderie 1 : lisses boulonnées', d: 'Présenter la lisse arrière basse puis la lisse arrière haute, enfin la lisse avant haute. Engager les vis CHC M6×16 à la main, sans serrer. Mesurer les diagonales de la face arrière (écart toléré 3 mm) puis serrer à 8 N·m.', ctrl: ['Diagonales égales à ±3 mm', 'Platines bien à plat contre les montants'] },
        { t: 'Module étagères : cadres Fe et lisses', d: 'Même procédure avec les deux cadres Fe (traverses tous les 300 mm) et trois lisses de 394 mm.', ctrl: ['Équerrage vérifié', 'Serrage 8 N·m'] },

  /*  B. ÉTAGÈRE MURALE DE CUISINE                                       */
  /* ------------------------------------------------------------------ */
  function etagere() {
    const b = new Constructeur('B', { coulAcier: COUL.acierB });
    const a = 20, D = 280, H = 900, zb = 0, murY = 284;
    const tab = (z) => ({ z, us: 'tab', nom: 'Traverse porte-tablette' });
    const Fb = b.typeCadre('Fb', { nom: 'Cadre soudé Fb (étagère murale)', sec: 'T20', D, Hf: H, Hb: H, verins: false,
      traverses: [tab(20), tab(400), tab(630), tab(900)] });
    const mods = [
      { code: 'M1', nom: 'Module assiettes / verres', x: 0, w: 450 },
      { code: 'M2', nom: 'Module bouteilles / verres', x: 450, w: 450 }
    ];
    mods.forEach((m, i) => {
      b.set({ module: i, etape: i });
      m.cG = b.cadre(Fb, m.x, zb, i);
      m.cD = b.cadre(Fb, m.x + m.w - a, zb, i);
      b.lisse(m.cG, m.cD, 'ar', 50, 2, 'Lisse arrière basse');
      b.lisse(m.cG, m.cD, 'ar', 860, 2, 'Lisse arrière haute');
      b.lisse(m.cG, m.cD, 'av', 860, 2, 'Lisse avant haute');
      b.lisse(m.cG, m.cD, 'av', 40, 2, 'Lisse avant basse (barre à tasses)');
      b.lisse(m.cG, m.cD, 'av', 435, 1, 'Rebord anti-chute niveau 1');
      b.lisse(m.cG, m.cD, 'av', 665, 1, 'Rebord anti-chute niveau 2');
      if (i === 1) b.lisse(m.cG, m.cD, 'av', 110, 1, 'Barre de retenue des bouteilles');
    });
    // la barre de retenue est prévue sur les deux modules (trous présents partout) : seul M2 la reçoit
    b.set({ etape: 2, module: 0 });
    b.liaison(mods[0].cD, mods[1].cG, [250, 750]);
    b.set({ etape: 3 });
    mods.forEach((m, i) => {
      b.set({ module: i });
      b.equerre(m.cG, 'g', 100, murY); b.equerre(m.cG, 'g', 800, murY);
      b.equerre(m.cD, 'd', 100, murY); b.equerre(m.cD, 'd', 800, murY);
    });
    // étape 4 : pose murale (pas de nouvelle pièce, mur mis en évidence)
    b.set({ etape: 5 });
    mods.forEach((m, i) => {
      b.set({ module: i });
      const niveaux = i === 0 ? [400, 630] : [20, 400, 630];
      niveaux.forEach(z => {
        b.add({ nom: 'Tablette', cat: 'panneau', couleur: COUL.cp15, mat: 'Contreplaqué 15 mm',
          debit: { ep: 15, L: m.w - 2, l: D - 2 * a - 2, usin: 'vernis alimentaire 2 couches ; 4 avant-trous Ø3' },
          forme: box(m.x + 1, a + 1, zb + z, m.w - 2, D - 2 * a - 2, 15) });
        b.q('visbois', 4, 'Vis à bois tête fraisée 4×30', 'fixation des tablettes');
      });
      b.add({ nom: 'Dessus', cat: 'panneau', couleur: COUL.cp15, mat: 'Contreplaqué 15 mm',
        debit: { ep: 15, L: m.w, l: D, usin: 'vernis alimentaire 2 couches ; 4 avant-trous Ø3' },
        forme: box(m.x, 0, zb + H, m.w, D, 15) });
      b.q('visbois', 4, 'Vis à bois tête fraisée 4×30', 'fixation des dessus');
    });
    b.set({ module: 0 });
    b.add({ nom: 'Bac égouttoir', cat: 'tole', couleur: COUL.inox, mat: 'Tôle inox 304 0,8 mm',
      debit: { ep: 0.8, L: 446 + 50, l: 238 + 50, usin: 'développé ; 4 bords relevés de 25 mm, angles pliés-soudés ou rivetés étanches' },
      info: 'Amovible pour le vidage et le lavage', formes: [box(2, 21, 20, 446, 238, 1), box(2, 21, 20, 446, 1, 25), box(2, 258, 20, 446, 1, 25), box(2, 21, 20, 1, 238, 25), box(447, 21, 20, 1, 238, 25)] });
    // râtelier à assiettes
    b.set({ etape: 6 });
    const pins = [];
    for (let k = 0; k < 11; k++) {
      const x = 45 + k * 36;
      pins.push(cyl('z', x, 70, 24, 3, 110, 6));
      pins.push(cyl('z', x, 200, 24, 3, 70, 6));
    }
    b.add({ nom: 'Râtelier à assiettes (soudé)', cat: 'rond', couleur: COUL.inox, sousEns: 'Râtelier à assiettes',
      debit: { sec: 'RP6', L: 110, n: 11, coupe: 'droite, bout arrondi', usin: 'picots avant (11 par râtelier)' },
      info: 'Sous-ensemble soudé : 2 plats 400×20×3 + 22 picots Ø6 (11 de 110 mm à l\'avant, 11 de 70 mm à l\'arrière), pas 36 mm : 10 assiettes',
      formes: pins.filter((_, k) => k % 2 === 0).concat([box(30, 60, 21, 400, 20, 3)]) });
    b.add({ nom: 'Râtelier à assiettes (soudé)', cat: 'rond', couleur: COUL.inox, sousEns: 'Râtelier à assiettes',
      debit: { sec: 'RP6', L: 70, n: 11, coupe: 'droite, bout arrondi', usin: 'picots arrière (11 par râtelier)' },
      formes: pins.filter((_, k) => k % 2 === 1).concat([box(30, 190, 21, 400, 20, 3)]) });
    b.add({ nom: 'Plat support de râtelier', cat: 'plat', couleur: COUL.inox, sousEns: 'Râtelier à assiettes',
      debit: { sec: 'P20x3', L: 400, coupe: '90° / 90°', usin: '11 trous Ø6 au pas de 36' }, formes: [] });
    b.add({ nom: 'Plat support de râtelier', cat: 'plat', couleur: COUL.inox, sousEns: 'Râtelier à assiettes',
      debit: { sec: 'P20x3', L: 400, coupe: '90° / 90°', usin: '11 trous Ø6 au pas de 36' }, formes: [] });
    // crochets à tasses
    mods.forEach((m, i) => {
      b.set({ module: i });
      for (let k = 0; k < 4; k++) {
        const x = m.x + 75 + k * 95;
        b.add({ nom: 'Crochet S + tasse suspendue', cat: 'equip', couleur: ['#c46b4e', '#e8e3d6', '#3f6e8c', '#d9a441'][(k + i) % 4],
          formes: [box(x - 1, -8, -30, 2, 4, 80), cyl('z', x, -50, -140, 42, 95, 14)] });
      }
      b.q('crochetS', 4, 'Crochet en S inox 60 mm', 'barre à tasses');

    // contenu

    for (let k = 0; k < 10; k++) b.add({ nom: 'Assiette Ø265', cat: 'equip', couleur: '#f2efe8', forme: cyl('x', 50 + k * 36 + 4, 135, 27 + 132, 132, 8, 22) });
    b.set({ module: 1 });
    for (let r = 0; r < 2; r++) for (let k = 0; k < 4; k++) {

    for (let k = 0; k < 10; k++) {

      else { verre(x, 80, 415, 42, 95, '#e9e4d8', 'Tasse à thé'); verre(x, 185, 415, 37, 110, '#d36b4b', 'Gobelet'); }
    }
    for (let k = 0; k < 9; k++) {
      const x = 55 + k * 95, mod = x < 450 ? 0 : 1;
      b.set({ module: mod });
      if (k < 6) verre(x, 120, 645, 40, 200, '#e6c66a', 'Verre à bière');
      else { verre(x, 80, 645, 41, 95, '#c6b9a0', 'Verre à whisky'); verre(x, 190, 645, 41, 95, '#c6b9a0', 'Verre à whisky'); }
    }
    b.set({ module: 0 });
    [[60, '#b33a2e'], [180, '#2e6b4f'], [300, '#d9a441']].forEach(([x, c]) => b.add({ nom: 'Boîte à thé / sucre', cat: 'equip', couleur: c, forme: box(x, 70, 915, 100, 120, 140) }));

    b.finaliser();
    return {
      code: 'B', nom: 'Étagère murale de cuisine', court: 'Étagère cuisine',
      dims: { L: 900, P: 280, H: 915 }, encombrement: '900 × 290 × 915 mm (tasses suspendues : 160 mm sous le meuble)',

      niveaux: { face: [0, 20, 400, 630, 900, 915] },
      cotesH: [0, 450, 900],
      etapes: [
        { t: 'Module M1 : cadres et lisses', d: 'Assembler les deux cadres Fb avec les six lisses (vis CHC M5×16). Serrer à 5 N·m après contrôle des diagonales de la face arrière.', ctrl: ['Diagonales égales à ±2 mm'] },

        { t: 'Équerres murales', d: 'Visser les 8 équerres 40×40×4 sur les faces intérieures des montants arrière, à z = 100 et z = 800 (vis M5×16).', ctrl: ['Ailes murales bien dans le plan arrière'] },
        { t: 'Traçage, perçage et pose au mur', d: 'Tracer au niveau le trait du dessous du meuble à 1250 mm du sol. Présenter le meuble (à deux), marquer les 8 trous, percer Ø8, cheviller. Visser d\'abord les 4 chevilles hautes, contrôler le niveau, puis les 4 basses.', ctrl: ['Jamais au-dessus du poste gaz', 'Niveau à ±1 mm', 'Charge totale admise 60 kg'] },

(function (root) {

  const E_ACIER = 210000;        // MPa

  function propSection(S) {
    let A = 0, I = 0, v = 0;
    if (S.type === 'carre') {
      const a = S.a, b = S.a - 2 * S.t;
      // rayon d'angle extérieur ≈ 1,5 t : on retire environ 4 % (valeur prudente)
      A = (a * a - b * b) * 0.96; I = (Math.pow(a, 4) - Math.pow(b, 4)) / 12 * 0.95; v = a / 2;
    } else if (S.type === 'rond') {
      const d = S.d, di = S.d - 2 * S.t;
      A = Math.PI / 4 * (d * d - di * di); I = Math.PI / 64 * (Math.pow(d, 4) - Math.pow(di, 4)); v = d / 2;
    } else if (S.type === 'plein') {
      A = Math.PI / 4 * S.d * S.d; I = Math.PI / 64 * Math.pow(S.d, 4); v = S.d / 2;
    } else if (S.type === 'plat') {
      A = S.b * S.e; I = S.b * Math.pow(S.e, 3) / 12; v = S.e / 2;
    } else if (S.type === 'corniere') {
      A = (2 * S.b - S.e) * S.e; I = 0; v = 0;
    }
    return { A, I, W: v ? I / v : 0, i: A ? Math.sqrt(I / A) : 0, kgm: A * RHO_ACIER * 1000 };

<script>
/*
 * Construction des scènes 3D à partir du modèle (partagé entre la simulation et les documents).
 */
(function (root) {
  'use strict';

  const COUCHES = [
    { id: 'structure', nom: 'Structure métallique' },
    { id: 'quinc', nom: 'Platines, pattes, quincaillerie' },
    { id: 'bois', nom: 'Panneaux bois / triplex' },
    { id: 'toles', nom: 'Tôles (inox, galva, alu)' },
    { id: 'equip', nom: 'Équipements et objets rangés' },
    { id: 'rideaux', nom: 'Rideaux' },
    { id: 'mur', nom: 'Mur et sol' }
  ];

  function coucheDe(p) {
    if (p.cat === 'tube' || p.cat === 'rond') return 'structure';
    if (p.cat === 'plat' || p.cat === 'quinc') return 'quinc';
    if (p.cat === 'panneau') return 'bois';
    if (p.cat === 'tole') return 'toles';
    if (p.cat === 'rideau') return 'rideaux';
    return 'equip';
  }

  function decaler(f, dx, dy, dz) {
    return Object.assign({}, f, { x: f.x + dx, y: f.y + dy, z: f.z + dz });
  }

  function construireScene(MODELE, code) {
    const sc = new root.MOTEUR.Scene();
    const K = code === 'K';
    const cfg = K ? MODELE.IMPLANTATION : MODELE.MEUBLES[code];
    const comps = K ? cfg.composants : [{ m: code, dx: 0, dy: 0, dz: 0 }];
    comps.forEach(c => {
      const m = MODELE.MEUBLES[c.m];
      m.parts.forEach(p => {
        if (!p.formes || !p.formes.length) return;
        sc.ajouter({
          formes: p.formes.map(f => decaler(f, c.dx, c.dy, c.dz)),
          couleur: p.couleur, alpha: p.cat === 'rideau' ? 0.6 : 1,
          part: p, meuble: m, couche: coucheDe(p)
        });
      });
    });
    // emprise pour le sol et le mur
    const b = sc.bornes();
    const C = MODELE.COUL;
    const tuile = 500;
    let x0, x1, y0, y1;
    if (cfg.sol) { x0 = cfg.sol.x0; x1 = cfg.sol.x1; y0 = cfg.sol.y0; y1 = cfg.sol.y1; }
    else { x0 = b[0] - 400; x1 = b[3] + 400; y0 = b[1] - 300; y1 = cfg.murY; }
    x0 = Math.floor(x0 / tuile) * tuile; x1 = Math.ceil(x1 / tuile) * tuile;
    if (cfg.sol) {
      for (let x = x0; x < x1; x += tuile) {
        for (let y = Math.floor(y0 / tuile) * tuile; y < y1; y += tuile) {
          const yy1 = Math.min(y + tuile, y1);
          const k = ((x / tuile) + Math.floor(y / tuile)) & 1;
          sc.ajouter({ formes: [{ t: 'box', x, y, z: -4, dx: tuile, dy: yy1 - y, dz: 4 }], couleur: k ? C.sol1 : C.sol2, couche: 'mur', pick: false });
        }
      }
    }
    const z0m = cfg.murZ0 !== undefined ? cfg.murZ0 : 0;
    const zh = cfg.murH;
    for (let x = x0; x < x1; x += tuile) {
      for (let z = z0m; z < zh; z += tuile) {
        const k = ((x / tuile) + Math.floor(z / tuile)) & 1;
        sc.ajouter({ formes: [{ t: 'box', x, y: cfg.murY, z, dx: tuile, dy: 30, dz: Math.min(tuile, zh - z) }], couleur: k ? C.mur : '#e4dfd6', couche: 'mur', pick: false });
      }
    }
    return sc;
  }

  function cadrer(scene, cam, W, H, marge) {
    const b = scene.bornes(o => o.couche !== 'mur' && o.visible);
    if (!isFinite(b[0])) return;
    cam.cible = [(b[0] + b[3]) / 2, (b[1] + b[4]) / 2, (b[2] + b[5]) / 2];
    const r = Math.hypot(b[3] - b[0], b[4] - b[1], b[5] - b[2]) / 2;
    const asp = Math.min(1, W / H);
    cam.distance = r * (marge || 1.08) / (cam.focale * asp);
  }

  const SCENES = { COUCHES, coucheDe, construireScene, cadrer };
  root.SCENES = SCENES;

/*

(function (root) {
  'use strict';

  const STYLE = {

  const fmt = (n) => String(Math.round(n * 10) / 10).replace('.', ',');

  function bornesFormes(formes) {
    const b = [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity];
    formes.forEach(f => {
      let x0, y0, z0, x1, y1, z1;

  /* Vue orthogonale d'un meuble */
  function vue(meuble, nomVue, opt) {

      if (opt.filtre && !opt.filtre(p)) return;
      if (p.cat === 'rideau' && !opt.rideaux) return;
      if (p.variante === 'ouvert') return;

    const mG = (opt.margeG || 26) / ech, mD = (opt.margeD || 14) / ech, mH = (opt.margeH || 10) / ech, mB = (opt.margeB || 22) / ech;

  function hachures(u0, u1, v, h, lw) {

  function cotation(ech) {

    Object.values(ft.traversants).forEach(t => {
      const x = t.cote === 'av' ? a / 2 : D - a / 2;
      s += '<circle cx="' + x + '" cy="' + (-t.z) + '" r="3.25" fill="#fff" stroke="#1b4f7a" stroke-width="' + lw.toFixed(3) + '"/><path d="M' + (x - 5) + ' ' + (-t.z) + 'h10M' + x + ' ' + (-t.z - 5) + 'v10" stroke="#1b4f7a" stroke-width="' + (lw * 0.7).toFixed(3) + '"/>';
    });
    Object.values(ft.faceAvant).forEach(t => { s += '<path d="M0 ' + (-t.z) + ' l' + (-4 / ech) + ' ' + (-1.5 / ech) + ' v' + (3 / ech) + 'Z" fill="#c0392b"/>'; });
    // vérins
    if (ft.verins) [a / 2, D - a / 2].forEach(x => { s += '<rect x="' + (x - 15) + '" y="0" width="30" height="' + (4 / ech).toFixed(1) + '" fill="#333"/>'; });
    // cotes
    const C = cotation(ech);
    s += C.chaineH([0, a, D - a, D], 0, -9);
    const zt = ft.traverses.map(t => t.z).sort((u, v) => u - v);
    s += C.chaineV([0].concat(zt.filter(z => z < Hb)).concat([Hb]).filter((v, i, arr) => arr.indexOf(v) === i), D, 12, true);
    if (Hb !== Hf) s += C.chaineV([0, Hf], 0, -6);
    const zf = Object.values(ft.trous.av).map(t => t.z).concat(Object.values(ft.traversants).filter(t => t.cote === 'av').map(t => t.z)).concat(Object.values(ft.faceAvant).map(t => t.z)).sort((u, v) => u - v);
    if (zf.length) s += C.chaineV([0].concat(zf), 0, Hb !== Hf ? -16 : -10, true);
    const zb = Object.values(ft.trous.ar).map(t => t.z).concat(Object.values(ft.traversants).filter(t => t.cote === 'ar').map(t => t.z)).sort((u, v) => u - v);
    if (zb.length) s += C.chaineV([0].concat(zb), D, 26, true);
    s += '</svg>';
    return s;
  }

  /* ---------- Détails d'assemblage (dessins à l'échelle 1:1 ou 1:2, en mm) ---------- */
  function cadreDetail(vb, contenu, titre, largeurMm) {
    const p = vb.split(' ').map(Number);
    const ech = largeurMm / p[2];
    return '<figure class="detail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '" width="' + largeurMm + 'mm" height="' + (p[3] * ech).toFixed(1) + 'mm" font-family="Arial, Helvetica, sans-serif" font-size="' + (2.4 / ech).toFixed(2) + '">' + contenu + '</svg><figcaption>' + titre + '</figcaption></figure>';
  }
  function rep(x1, y1, x2, y2, t, anc) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#1b4f7a" stroke-width="0.35"/><circle cx="' + x1 + '" cy="' + y1 + '" r="0.9" fill="#1b4f7a"/><text x="' + (x2 + (anc === 'end' ? -1 : 1)) + '" y="' + (y2 + 1.2) + '" fill="#1b4f7a" text-anchor="' + (anc || 'start') + '">' + t + '</text>';
  }
  const HACH = '<defs><pattern id="hach" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3" stroke="#555" stroke-width="0.35"/></pattern><pattern id="hachB" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#8a6a3a" stroke-width="0.35"/></pattern><pattern id="hachM" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#999" stroke-width="0.5"/><line x1="2.5" y1="0" x2="2.5" y2="5" stroke="#bbb" stroke-width="0.3"/></pattern></defs>';
  function tubeCoupe(x, y, a, t) {
    return '<rect x="' + x + '" y="' + y + '" width="' + a + '" height="' + a + '" rx="' + (1.5 * t) + '" fill="url(#hach)" stroke="#111" stroke-width="0.35"/><rect x="' + (x + t) + '" y="' + (y + t) + '" width="' + (a - 2 * t) + '" height="' + (a - 2 * t) + '" rx="' + (0.5 * t) + '" fill="#fff" stroke="#111" stroke-width="0.35"/>';
  }

  function details() {

    c += '<path d="M38 20 l3 -3 v3z M38 45 l3 3 v-3z" fill="#111"/>';        // soudures
    c += '<rect x="26.5" y="28" width="7" height="9" fill="#e0b84a" stroke="#111" stroke-width="0.3"/><rect x="33.5" y="26.5" width="1.5" height="12" fill="#e0b84a" stroke="#111" stroke-width="0.3"/>';  // écrou à sertir
    c += '<line x1="20" y1="32.5" x2="48" y2="32.5" stroke="#111" stroke-width="0.25" stroke-dasharray="4 1 1 1"/>';
    c += '<text x="8" y="12" font-weight="bold">Coupe horizontale au droit d\'un boulon</text>';
    c += rep(30, 30, 20, 58, 'Écrou à sertir M6 (perçage Ø9)', 'start') + rep(36.5, 40, 50, 58, 'Platine 25×3, trous Ø6,5') + rep(70, 25, 80, 10, 'Lisse 25×25×1,5') + rep(16, 22, 6, 8, 'Montant 25×25×1,5', 'start');
    L.push(cadreDetail('0 0 110 64', c, 'D1 · Lisse sur platine d\'about : 2 vis CHC M6×16 + rondelles, serrage 8 N·m. La vis traverse la platine au-dessus et au-dessous de la lisse.', 80));
    // D2 : liaison inter-modules
    c = HACH;
    c += tubeCoupe(20, 20, 25, 1.5) + tubeCoupe(45, 20, 25, 1.5);
    c += '<rect x="10" y="30" width="70" height="5" fill="#d0d4d8" stroke="#111" stroke-width="0.3"/>';
    c += '<rect x="7" y="27" width="3" height="11" fill="#9aa1a8" stroke="#111" stroke-width="0.3"/><rect x="17" y="26" width="3" height="13" fill="#bbb" stroke="#111" stroke-width="0.3"/><rect x="70" y="26" width="3" height="13" fill="#bbb" stroke="#111" stroke-width="0.3"/><rect x="73" y="27.5" width="6" height="10" fill="#9aa1a8" stroke="#111" stroke-width="0.3"/>';
    c += '<text x="8" y="12" font-weight="bold">Coupe horizontale, montants accolés</text>';
    c += rep(8.5, 32.5, 4, 52, 'Tête de vis M6×60', 'start') + rep(18.5, 37, 26, 54, 'Rondelle large M6×18') + rep(76, 34, 84, 50, 'Écrou frein Nylstop') + rep(57, 22, 66, 10, 'Trou traversant Ø6,5');
    L.push(cadreDetail('0 0 100 60', c, 'D2 · Liaison entre deux modules : boulons traversants, 2 hauteurs × avant et arrière. Serrage limité à 5 N·m pour ne pas écraser les tubes.', 72));
    // D3 : ancrage mural
    c = HACH;
    c += '<rect x="70" y="5" width="22" height="70" fill="url(#hachM)" stroke="#111" stroke-width="0.35"/>';
    c += tubeCoupe(20, 30, 25, 1.5);
    c += '<rect x="45" y="30" width="4" height="25" fill="#b8bec5" stroke="#111" stroke-width="0.3"/>';
    c += '<path d="M45 30 h21 v-24 h4 v28 h-25z" fill="#b8bec5" stroke="#111" stroke-width="0.35"/>';
    c += '<rect x="70" y="16" width="16" height="7" fill="#f2f2f2" stroke="#111" stroke-width="0.3"/><rect x="58" y="17.5" width="28" height="4" fill="#9aa1a8" stroke="#111" stroke-width="0.3"/><rect x="62" y="15" width="4" height="9" fill="#9aa1a8" stroke="#111" stroke-width="0.3"/>';
    c += '<line x1="45" y1="70" x2="70" y2="70" stroke="#1b4f7a" stroke-width="0.3"/><text x="57.5" y="68.5" text-anchor="middle" fill="#1b4f7a">jeu 15–20</text>';
    c += '<text x="8" y="10" font-weight="bold">Vue de dessus</text>';
    c += rep(32, 42, 10, 64, 'Montant arrière', 'start') + rep(47, 44, 52, 62, 'Vis CHC M6×16') + rep(67, 8, 40, 8, 'Équerre 40×40×4, trou oblong 8,5×20', 'end') + rep(78, 19.5, 96, 36, 'Cheville Ø8') + rep(80, 60, 96, 52, 'Mur');
    L.push(cadreDetail('0 0 120 78', c, 'D3 · Équerre d\'ancrage mural : le trou oblong rattrape la plinthe et les défauts du mur. Cheville choisie selon le support (tableau des chevilles).', 80));
    // D4 : vérin
    c = HACH;
    c += '<rect x="30" y="5" width="25" height="40" fill="none" stroke="#111" stroke-width="0.35"/><rect x="31.5" y="5" width="22" height="40" fill="#fff" stroke="none"/><path d="M30 5 v40 h1.5 v-40z M53.5 5 v40 h1.5 v-40z" fill="url(#hach)" stroke="#111" stroke-width="0.3"/>';
    c += '<rect x="31.5" y="27" width="22" height="18" fill="#444" stroke="#111" stroke-width="0.3"/><rect x="38.5" y="38" width="8" height="18" fill="#9aa1a8" stroke="#111" stroke-width="0.3"/>';
    c += '<rect x="27.5" y="56" width="30" height="5" rx="1.5" fill="#222"/><line x1="10" y1="61" x2="75" y2="61" stroke="#111" stroke-width="0.6"/>';
    c += rep(32, 35, 8, 30, 'Embout taraudé M8', 'start') + rep(46, 50, 64, 47, 'Tige M8, course 15–30') + rep(55, 58, 64, 60, 'Patin Ø30');
    L.push(cadreDetail('0 0 90 66', c, 'D4 · Vérin de nivellement sous chaque montant (A et C). Régler à mi-course au montage, puis ajuster au niveau.', 62));
    // D5 : tablette vissée par dessous
    c = HACH;
    c += '<rect x="5" y="18" width="80" height="15" fill="url(#hachB)" stroke="#5c4526" stroke-width="0.35"/>';
    c += tubeCoupe(30, 33, 25, 1.5);
    c += '<rect x="41" y="20" width="3" height="21" fill="#9aa1a8" stroke="#111" stroke-width="0.25"/><path d="M38.5 58 h8 l-2 -2.5 h-4z" fill="#9aa1a8" stroke="#111" stroke-width="0.25"/><rect x="41" y="41" width="3" height="15" fill="#9aa1a8" stroke="#111" stroke-width="0.25"/>';
    c += rep(60, 25, 70, 10, 'Tablette CP 15 ou 18') + rep(31, 45, 6, 52, 'Traverse 25×25', 'start') + rep(42.5, 34, 64, 46, 'Ø4,5 dessus') + rep(45, 57, 64, 62, 'Ø8 dessous (passage tournevis)') + rep(42.5, 24, 20, 10, 'Vis bois 4×30', 'end');
    L.push(cadreDetail('0 0 100 66', c, 'D5 · Fixation des tablettes : 2 vis à bois par extrémité, passées par dessous. La vis ne doit pas déboucher (longueur 30 pour 15 mm de bois + 1,5 mm de paroi).', 70));
    // D6 : poste gaz
    c = HACH;
    c += '<rect x="5" y="10" width="6" height="110" fill="#9aa1a8" stroke="#111" stroke-width="0.3"/><rect x="129" y="10" width="6" height="110" fill="#9aa1a8" stroke="#111" stroke-width="0.3"/>';
    c += '<rect x="11" y="88" width="118" height="6" fill="#9aa1a8" stroke="#111" stroke-width="0.3"/><rect x="11" y="85.5" width="118" height="2.5" fill="#cfd5da" stroke="#111" stroke-width="0.3"/>';
    [74, 88, 102].forEach((y, i) => { c += '<circle cx="8" cy="' + y + '" r="1.6" fill="' + (i === 1 ? '#c0392b' : '#fff') + '" stroke="#111" stroke-width="0.25"/>'; });
    c += '<rect x="40" y="40" width="60" height="45.5" rx="6" fill="#2a63a8" stroke="#111" stroke-width="0.35"/><rect x="50" y="30" width="40" height="10" fill="#2a63a8" stroke="#111" stroke-width="0.3"/><rect x="62" y="22" width="16" height="8" fill="#bbb" stroke="#111" stroke-width="0.3"/><rect x="30" y="19" width="80" height="3" fill="#ccc" stroke="#111" stroke-width="0.3"/>';
    c += '<rect x="37" y="52" width="66" height="5" fill="none" stroke="#c4532f" stroke-width="1.2"/>';
    c += '<rect x="134" y="5" width="2" height="60" fill="#aeb6bd" stroke="#111" stroke-width="0.2"/>';
    c += rep(70, 20, 120, 4, 'Support casserole ≈ 870 du sol') + rep(100, 54.5, 112, 50, 'Collier + sangle') + rep(8, 88, 20, 112, 'Crans de réglage : 340 / 400 / 460', 'start') + rep(70, 86, 92, 112, 'Plateau tôle 2 mm sur 2 traverses');
    L.push(cadreDetail('0 0 150 122', c, 'D6 · Poste gaz (vue de face simplifiée, 1:10) : plateau réglable en hauteur, collier anti-basculement, écran galvanisé côté plaque induction.', 72));
    return L;
  }

  const PLANS = { vue, cadre, details, cotation, bornesFormes };
  root.PLANS = PLANS;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/*
 * Génération des trois documents imprimables (dossier de conception, nomenclature et débit, notice).
 * Le contenu est recalculé à partir du modèle à chaque ouverture.
 */
(function () {
  'use strict';
  const M = window.MODELE, C = window.CALC, S = window.SCENES, P = window.PLANS, E = window.MOTEUR;
  const TYPE = window.TYPE_DOC;
  const ME = M.MEUBLES;
  Object.values(ME).forEach(m => C.nomenclature(m, M.SECTIONS));

  /* ---------- Formatage ---------- */
  function nf(x, d) {
    if (x === undefined || x === null || isNaN(x)) return '';
    const s = Number(x).toFixed(d === undefined ? 0 : d);
    const [ent, dec] = s.split('.');
    const e = ent.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return dec ? e + ',' + dec : e;
  }
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function tableau(entetes, lignes, classes) {
    classes = classes || [];
    let h = '<table><thead><tr>' + entetes.map((e, i) => '<th class="' + (classes[i] || '') + '">' + e + '</th>').join('') + '</tr></thead><tbody>';
    lignes.forEach(l => { h += '<tr>' + l.map((c, i) => '<td class="' + (classes[i] || '') + '">' + (c === undefined ? '' : c) + '</td>').join('') + '</tr>'; });
    return h + '</tbody></table>';
  }
  const ok = (b) => b ? '<span class="ok">conforme</span>' : '<span class="ko">à reprendre</span>';

  /* ---------- Rendus 3D ---------- */
  const scenes = {};
  const rendu = new E.Rendu(document.createElement('canvas'));
  function image(code, opts) {
    opts = opts || {};
    if (!scenes[code]) scenes[code] = S.construireScene(M, code);
    const sc = scenes[code];
    const m = ME[code];
    const W = opts.W || 1200, H = opts.H || 820;
    const cam = new E.Camera();
    cam.lacet = opts.lacet !== undefined ? opts.lacet : -0.62;
    cam.tangage = opts.tangage !== undefined ? opts.tangage : 0.36;
    cam.focale = 0.42;
    sc.objets.forEach(o => { o.visible = o.couche !== 'mur' || opts.mur !== false; o.teinte = null; o.decal = [0, 0, 0]; });
    S.cadrer(sc, cam, W, H, opts.marge || 1.0);
    const etape = opts.etape;
    sc.objets.forEach(o => {
      if (!o.part) return;
      const p = o.part;
      let v = true;
      if (etape !== undefined && p.etape > etape) v = false;
      if (p.variante === 'ouvert' && !opts.rideauxOuverts) v = false;
      if (p.variante === 'ferme' && opts.rideauxOuverts) v = false;
      if (opts.sans && opts.sans.indexOf(o.couche) >= 0) v = false;
      o.visible = v;
      if (etape !== undefined && p.etape === etape) o.teinte = [217, 104, 43, 0.5];
      if (opts.eclate && m) o.decal = [(p.module || 0) * opts.eclate, 0, 0];
    });
    rendu.dimension(W, H);
    rendu.dessiner(sc, cam, { fond: [255, 255, 255] });
    return rendu.canvas.toDataURL('image/png');
  }

  /* ---------- Calculs de dimensionnement ---------- */
  const SIG_ADM = 235 / 1.5;
  function masseMeuble(m) {
    const n = C.nomenclature(m, M.SECTIONS);
    let acier = 0, bois = 0, tole = 0;
    n.liste.forEach(g => {
      const t = g.masseU * g.qte;
      if (g.cat === 'panneau') bois += t; else if (g.cat === 'tole') tole += t; else acier += t;
    });
    return { acier, bois, tole, total: acier + bois + tole + 1.5 };
  }
  const MASSES = { A: masseMeuble(ME.A), B: masseMeuble(ME.B), C: masseMeuble(ME.C) };

  function verifications() {
    const L = [];
    const g = 9.81;
    const T25 = C.propSection(M.SECTIONS.T25), T20 = C.propSection(M.SECTIONS.T20), R25 = C.propSection(M.SECTIONS.R25);
    const plaque = (b, h) => b * Math.pow(h, 3) / 12;
    function ligneFleche(meuble, elt, portee, larg, ep, kg, critere) {
      const I = plaque(larg, ep);
      const d = C.flecheRepartie(kg * g / portee, portee, C.E_CP, I);
      L.push([meuble, elt, 'CP ' + ep + ' mm, portée ' + portee + ', ' + kg + ' kg répartis', nf(d, 2) + ' mm (L/' + nf(portee / d) + ')', 'L/' + critere, ok(portee / d >= critere)]);
    }
    // A
    ligneFleche('A', 'Tablette penderie 698 × 498', 675, 498, 15, 30, 250);
    ligneFleche('A', 'Tablette étagère 448 × 498', 425, 498, 15, 30, 250);
    ligneFleche('A', 'Dessus 700 × 550', 675, 550, 15, 15, 250);
    {
      const q = 35 * g / 642;
      const d = C.flecheRepartie(q, 642, C.E_ACIER, R25.I), s = q * 642 * 642 / 8 / R25.W;
      L.push(['A', 'Tringle Ø25×1,5', 'portée 642, 35 kg de vêtements', nf(d, 2) + ' mm ; σ = ' + nf(s) + ' MPa', 'L/300 ; ' + nf(SIG_ADM) + ' MPa', ok(642 / d >= 300 && s <= SIG_ADM)]);
    }
    {
      const q = 15 * g / 500;
      const d = C.flecheRepartie(q, 500, C.E_ACIER, T25.I), s = q * 500 * 500 / 8 / T25.W;
      L.push(['A', 'Traverse porte-tablette 25×25', 'portée 500, demi-tablette 15 kg', nf(d, 3) + ' mm ; σ = ' + nf(s, 1) + ' MPa', 'L/300 ; ' + nf(SIG_ADM) + ' MPa', ok(500 / d >= 300 && s <= SIG_ADM)]);
    }
    {
      const N = (195 + 25) * g / 4;
      const Ncr = Math.PI * Math.PI * C.E_ACIER * T25.I / (1900 * 1900);
      L.push(['A', 'Montant 25×25 (flambement)', 'module étagères plein, 4 montants, Lf = 1900', 'N = ' + nf(N) + ' N ; Ncr = ' + nf(Ncr) + ' N', 'coefficient ≥ 3', ok(Ncr / N >= 3) + ' (×' + nf(Ncr / N, 0) + ')']);
    }
    // B
    ligneFleche('B', 'Tablette bouteilles 448 × 238', 428, 238, 15, 14, 250);
    ligneFleche('B', 'Tablette verres 448 × 238', 428, 238, 15, 8, 250);
    {
      const Mf = (60 / 4) * g * 140;
      const s = Mf / (2 * T20.W);
      L.push(['B', 'Nœuds soudés traverse / montant 20×20', 'charge par cadre 15 kg, bras de levier 140, repris par 2 traverses', 'σ = ' + nf(s, 1) + ' MPa', nf(SIG_ADM) + ' MPa', ok(s <= SIG_ADM)]);
    }
    // C
    {
      const I = plaque(570, 18), Pp = 1000;
      const d = C.flecheCentree(Pp, 455, C.E_CP, I);
      L.push(['C', 'Plan bois zone induction', 'CP 18, portée 455, appui d\'une personne 100 kg au centre', nf(d, 2) + ' mm', '3 mm', ok(d <= 3)]);
    }
    ligneFleche('C', 'Tablette casseroles 1048 × 498', 1000, 498, 18, 25, 200);
    {
      const I = plaque(300, 1.5);
      const d = C.flecheCentree(100, 190, 193000, I);
      const d2 = C.flecheCentree(100, 545, 193000, I);
      L.push(['C', 'Bac inox 1,5 mm (zone chaude)', 'casserole 10 kg, bande de 300 mm ; portée 190 grâce aux 2 traverses (545 sans)', nf(d, 2) + ' mm (sans traverses : ' + nf(d2, 0) + ' mm)', '1,5 mm', ok(d <= 1.5)]);
    }
    {
      const I = 2 * (2 * Math.pow(20, 3) / 12);
      const d = C.flecheCentree(200, 500, C.E_ACIER, I);
      L.push(['C', 'Plateau bouteille, tôle 2 mm à bords tombés', 'portée 500, bouteille pleine + casserole 20 kg', nf(d, 2) + ' mm', '2 mm', ok(d <= 2)]);
    }
    return L;
  }

  function stabilite() {
    const g = 9.81;
    const r = [];
    // A sans ancrage
    const WA = (MASSES.A.total + 0.4 * 415) * g;
    const FA = WA * 275 / 1935;
    r.push(['A', 'Effort horizontal en haut qui fait basculer le meuble non fixé (charge à 40 %)', nf(FA) + ' N', 'Un adulte qui tire sur une tablette ou s\'y accroche dépasse 300 N : ancrage obligatoire']);
    r.push(['A', 'Effort par équerre si 300 N en haut sont repris par 2 équerres seulement', nf(150) + ' N', 'Brique creuse : 300 à 600 N par cheville, coefficient ≥ 2']);
    // B
    const WB = (MASSES.B.total + 60) * g;
    const T = WB * 140 / 700 / 4, V = WB / 8;
    r.push(['B', 'Traction par cheville haute (4 chevilles hautes, bras de levier 140 mm, entraxe vertical 700 mm)', nf(T) + ' N', 'Très inférieure à la tenue d\'une cheville Ø8, même en brique creuse']);
    r.push(['B', 'Cisaillement par cheville (8 chevilles)', nf(V) + ' N', 'Charge totale admise : 60 kg d\'objets']);
    // C
    const WG = (12 + 6) * g, hG = 870 - 402, rb = 125;
    r.push(['C', 'Poussée latérale qui renverse la bouteille sur son plateau sans collier (casserole pleine)', nf(WG * rb / hG) + ' N', 'Moins de 5 kg de poussée : le collier fermé est indispensable']);
    const WC = (MASSES.C.total + 40) * g;
    r.push(['C', 'Effort horizontal en haut des montants (1420) qui fait basculer la station non fixée', nf(WC * 275 / 1420) + ' N', '4 équerres murales, chacune reprend largement cet effort']);
    return r;
  }

    let h = couverture('Dossier de conception et plans', 'Dressing modulaire à rideaux · Étagère murale de cuisine · Station de cuisson', image('K', { W: 1500, H: 900, lacet: -0.5, tangage: 0.3 }), LISTE_DOCS);
    h += '<section class="sommaire"><h2>Sommaire</h2><ol><li>Programme et hypothèses</li><li>Choix des tubes : 20×20 ou 25×25</li><li>Panneaux bois et tôles</li><li>Charges et vérifications</li><li>Assemblages démontables et fixations murales</li><li>Sécurité gaz, chaleur, électricité, poussière</li><li>Finitions et protection</li><li>Plans et perspectives</li></ol></section>';

    // 1. Programme
    h += '<h2>1. Programme et hypothèses</h2>';

      ['Brûleur + support alu', M.HYP.bruleur.txt, 'Ajuster le cran du plateau pour amener le support à la hauteur de la plaque induction (≈ 870 mm du sol)'],

    // 2. Tubes
    h += '<h2>2. Choix des tubes : 20×20 ou 25×25</h2>';
    const secs = [['20×20×1,2', { type: 'carre', a: 20, t: 1.2 }], ['20×20×1,5', { type: 'carre', a: 20, t: 1.5 }], ['25×25×1,2', { type: 'carre', a: 25, t: 1.2 }], ['25×25×1,5', { type: 'carre', a: 25, t: 1.5 }], ['25×25×2', { type: 'carre', a: 25, t: 2 }]];
    const ref = C.propSection(secs[1][1]);
    h += tableau(['Section', 'Aire (mm²)', 'I (mm⁴)', 'W (mm³)', 'Masse (kg/m)', 'Rigidité / 20×1,5', 'Prix / 20×1,5*', 'Soudure électrode', 'Écrou à sertir'], secs.map(([n, s]) => {
      const p = C.propSection(s);

    }), ['', 'n', 'n', 'n', 'n', 'n', 'n', '', '']);
    h += '<p class="petit">* Le prix d\'un tube suit à peu près sa masse ; l\'écart réel dépend du fournisseur. Valeurs de section minorées de 4 à 5 % pour tenir compte des angles arrondis.</p>';
    const syn = C.syntheseAchats(M);
    const t25 = syn.sections.find(s => s.sec === 'T25'), t20 = syn.sections.find(s => s.sec === 'T20');

    h += '<h3>2.1 Décision</h3>';
    h += tableau(['Meuble', 'Section retenue', 'Raisons'], [
      ['A · Dressing', '<b>25×25×1,5</b>', 'Montants de 1,9 m : le 25 est deux fois plus rigide que le 20 pour 27 % de masse en plus, ce qui supprime l\'effet « meuble qui vibre ». Les écrous à sertir M6 tiennent mieux dans une face de 25. Charge totale de calcul 415 kg.'],
      ['B · Étagère murale', '<b>20×20×1,5</b>', 'Charges faibles (60 kg au total) et meuble suspendu : chaque kilo d\'acier économisé est un kilo de moins sur les chevilles. Aspect plus fin au-dessus du plan de travail. Écrous à sertir M5.'],

    h += '<p><b>Épaisseur 1,5 mm partout.</b> Le 1,2 mm ne fait gagner que 15 à 20 % de masse, mais il se perce facilement à l\'électrode, s\'écrase sous un boulon serré et donne moins de filets aux vis autoperceuses. Le 2 mm coûterait 30 % de plus sans besoin mécanique. Pour l\'ensemble du projet : ' + nf(t25.Ltot / 1000, 1) + ' m de 25×25×1,5 (' + nf(t25.barres.length) + ' barres de 6 m, ' + nf(t25.kg, 1) + ' kg) et ' + nf(t20.Ltot / 1000, 1) + ' m de 20×20×1,5 (' + nf(t20.barres.length) + ' barres, ' + nf(t20.kg, 1) + ' kg). Tout faire en 20×20 économiserait environ ' + nf(t25.kg - t25.Ltot / 1000 * kg20, 0) + ' kg d\'acier, au prix d\'une rigidité divisée par deux sur les deux grands meubles : ce n\'est pas un bon calcul.</p>';

    // 3. Panneaux
    h += '<h2>3. Panneaux bois et tôles</h2>';
    h += tableau(['Matériau', 'Emploi', 'Justification'], [
      ['Contreplaqué 15 mm (okoumé ou triplex bouleau)', 'Tablettes et dessus de A et B, étagère à épices de C', 'Rigidité suffisante jusqu\'à 700 mm de portée sous 30 kg ; tient les vis 4×30 ; un panneau de 2440 × 1220 pèse environ 22 kg et se manipule seul.'],
      ['Contreplaqué 18 mm (collage extérieur)', 'Plan de travail bois et tablettes de C', 'Portée de 1000 mm sous casseroles, appuis sur le plan, ambiance humide de cuisine. Le collage extérieur (classe 3, « CTB-X » ou « WBP ») évite le décollement des plis.'],
      ['Contreplaqué 5 mm', 'Joues latérales de A', 'Fermeture anti-poussière, sans rôle structurel. Peut être remplacé par un tissu tendu.'],
      ['Tôle inox 304 1,5 mm', 'Bac de la zone chaude de C', 'Pas de bois sous le réchaud ni sous la casserole chaude ; bords relevés de 15 mm qui retiennent les débordements.'],
      ['Tôle inox 304 0,8 mm', 'Bac égouttoir de B', 'Inoxydable, se vide et se lave.'],
      ['Tôle acier 2 mm', 'Plateau porte-bouteille de C', 'Bords tombés de 20 mm qui servent de raidisseurs ; peinte.'],
      ['Tôle galvanisée 1 mm', 'Écran thermique de C', 'Réfléchit la chaleur de la flamme vers le haut, côté gaz.'],
      ['Tôle aluminium 1 mm', 'Crédence murale de C', 'Protège le mur derrière le brûleur et le réchaud ; se nettoie à l\'éponge.']
    ]);
    h += '<p>L\'aggloméré et le MDF sont écartés : ils gonflent à l\'humidité, tiennent mal les vis après deux ou trois démontages et sont plus lourds à rigidité égale.</p>';

    // 4. Vérifications
    h += '<h2>4. Charges et vérifications</h2>';
    h += '<h3>4.1 Charges d\'exploitation retenues</h3>';
    h += tableau(['Meuble', 'Élément', 'Charge de calcul'], [
      ['A', 'Tablette (chaussures, vêtements pliés)', '30 kg par tablette'], ['A', 'Tringle de penderie', '35 kg répartis'], ['A', 'Dessus (bagages légers)', '15 kg'], ['A', 'Total meuble chargé', '415 kg'],
      ['B', 'Bouteilles (niveau bas M2)', '14 kg'], ['B', 'Verres, tasses, assiettes, dessus', '6 à 8 kg par niveau'], ['B', 'Total suspendu au mur', '60 kg + ' + nf(MASSES.B.total) + ' kg de meuble'],

    ]);
    h += '<p>Acier S235 : contrainte admissible retenue 235 / 1,5 = ' + nf(SIG_ADM) + ' MPa ; E = 210 000 MPa. Contreplaqué : E = 6 500 MPa (valeur prudente dans le sens des plis extérieurs).</p>';
    h += '<h3>4.2 Résultats</h3>';
    h += tableau(['', 'Élément', 'Hypothèse', 'Résultat', 'Limite', 'Avis'], verifications());
    h += '<h3>4.3 Stabilité et ancrage</h3>';
    h += tableau(['', 'Situation', 'Valeur', 'Conclusion'], stabilite());
    h += '<div class="note">Les trois meubles doivent être fixés au mur avant d\'être chargés. Le dressing, haut et peu profond, bascule sous un effort qu\'un adulte exerce sans s\'en rendre compte ; la bouteille surélevée bascule sous une poussée de quelques kilos si le collier n\'est pas fermé.</div>';

    // 5. Assemblages
    h += '<h2 class="saut">5. Assemblages démontables et fixations murales</h2>';
    h += '<h3>5.1 Principe</h3><ul>' +
      '<li><b>Cadres latéraux soudés</b> (deux montants + traverses de profondeur) : c\'est la partie rigide, fabriquée en atelier sur gabarit. Les cadres sont plats, ils s\'empilent pour le transport.</li>' +
      '<li><b>Lisses boulonnées</b> : tube de largeur avec une platine 3 mm soudée à chaque bout. Deux vis CHC par platine (une au-dessus, une au-dessous du tube) bloquent la rotation : le module ne se déforme pas en parallélogramme.</li>' +
      '<li><b>Écrous à sertir</b> dans les montants : filetage acier permanent, aucun écrou à tenir derrière le tube, et le filetage ne s\'use pas au fil des démontages, contrairement à une vis autoperceuse.</li>' +
      '<li><b>Cadres réversibles</b> : chaque cadre est percé et serti sur ses deux faces latérales. Un même cadre se monte à gauche ou à droite d\'un module, ce qui évite les erreurs et permet de recomposer les modules dans un autre logement.</li>' +

      ['Tablette entre cadres', '1 mm de chaque côté, appui ≥ 22 mm sur la traverse', 'Vis bois 4×30 à la main'],
      ['Tringle de penderie', 'Longueur = entre-traverses − 8 mm', 'Cuvettes vissées M5'],
      ['Rideau', 'Bas à 15 mm du sol, recouvrement central 50 mm', '—'],
      ['Vérins M8', 'Course 15 à 30 mm, réglés à mi-course au montage', 'Contre-écrou à la main']
    ]);
    h += '<h3>5.3 Fixation murale selon le support</h3>' + CHEVILLES;
    h += '<h3>5.4 Détails</h3><div class="details">' + P.details().join('') + '</div>';

    // 6. Sécurité
    h += '<h2 class="saut">6. Sécurité gaz, chaleur, électricité, poussière</h2>';
    h += '<h3>6.1 Poste gaz</h3><ul>' +
      '<li>Bouteille toujours debout, dans un logement ouvert devant et dessous : jamais dans un placard fermé. Le gaz butane ou propane est plus lourd que l\'air ; le local doit avoir une entrée d\'air basse et une sortie haute permanentes.</li>' +
      '<li>Plateau surélevé à 400 mm (réglable) pour cuisiner debout, collier fermé par sangle pendant toute la cuisson.</li>' +
      '<li>Robinet et détendeur accessibles en façade ; robinet fermé après chaque utilisation.</li>' +
      '<li>Étanchéité contrôlée à l\'eau savonneuse à chaque changement de bouteille, jamais à la flamme. Joint du brûleur remplacé au moindre défaut.</li>' +
      '<li>Casserole de Ø 300 mm au plus : une casserole plus large renvoie la chaleur vers le haut de la bouteille.</li>' +
      '<li>Rien au-dessus du brûleur sur 750 mm (l\'étagère B est placée à côté, jamais au-dessus).</li>' +
      '<li>Couverture anti-feu fixée au mur à gauche du poste ; détecteur de monoxyde de carbone conseillé dans la pièce.</li></ul>';
    h += '<h3>6.2 Distances thermiques</h3>';

      ['Brûleur et tout élément au-dessus', 'dégagé', '750 mm'],

      ['Foyer du réchaud et étagère à épices', '≈ 450 mm', '400 mm'],
      ['Bouteille et bloc de prises', '≈ 1 230 mm', '1 000 mm'],
      ['Plaque induction et parois (ventilation)', '95 mm sur les côtés, 100 mm à l\'arrière', '50 mm']
    ]);
    h += '<h3>6.3 Électricité</h3><p>Plaque induction 2000 W et réchaud 1500 W : 3,5 kW, soit environ 15 A sous 230 V, à la limite d\'une prise 16 A. Les deux appareils ne doivent pas fonctionner en même temps sur la même prise ; jamais de multiprise. Le bloc 2 prises 16 A est vissé sur le montant arrière droit, à plus d\'un mètre de la bouteille, alimenté par un câble 3 × 2,5 mm² (3 × 1,5 mm² au minimum). Les câbles ne passent ni au-dessus du bac inox ni près de la flamme.</p>';
    h += '<h3>6.4 Poussière (dressing)</h3><p>Dessus pleins de 15 mm qui recouvrent toute la surface, joues latérales de 5 mm, et deux rideaux tombant à 15 mm du sol avec 50 mm de recouvrement au centre. La tringle est avancée de 55 mm devant les montants pour que les rideaux ne frottent pas sur les tablettes. Un lambrequin (bande de tissu de 100 mm agrafée sur le chant avant des dessus) peut fermer le jour en haut.</p>';

    // 7. Finitions
    h += '<h2>7. Finitions et protection</h2><ul>' +
      '<li>Acier : dégraissage, brossage des soudures, une couche d\'antirouille, deux couches de laque glycérophtalique ou de peinture époxy. Surface à peindre ≈ ' + nf((t25.Ltot * 0.1 + t20.Ltot * 0.08) / 1000, 1) + ' m² : 1 L d\'antirouille et 1 L de laque suffisent.</li>' +
      '<li>Module gaz : peinture haute température (600 °C) sur la partie haute des cadres ; écran galvanisé laissé brut.</li>' +
      '<li>Contreplaqué : ponçage grain 120, chants arrondis, vernis polyuréthane deux couches (trois sur le plan de travail). Pour l\'étagère B, vernis compatible contact alimentaire.</li>' +
      '<li>Écrous à sertir posés après peinture ou protégés par une vis pendant la peinture.</li></ul>';

    // 8. Plans
    h += plansMeubles();
    return h;

  function plansMeubles() {
    let h = '';

      A: { ech: 1 / 15, echT: '1:15', echCadre: 1 / 12.5, echCadreT: '1:12,5' },

      C: { ech: 1 / 12.5, echT: '1:12,5', echCadre: 1 / 10, echCadreT: '1:10' }
    };
    Object.values(ME).forEach(m => {
      const c = cfg[m.code];
      const sol = m.code !== 'B';
      const zMax = m.dims.H;
      const nivFace = m.niveaux.face.slice().sort((u, v) => u - v).filter((v, i, a) => a.indexOf(v) === i);
      const textesE = m.code === 'A' ? m.niveaux.faceE.map(z => ({ u: 925, v: z + 30, t: 'z ' + z, a: 'middle', k: 0.85, c: '#1b4f7a' })) : [];
      // Feuille 1 : face + droite
      const face = P.vue(m, 'face', { ech: c.ech, sol, equip: true, rideaux: false, margeG: 34, margeB: 26,
        cotesH: [{ pos: m.cotesH, v: 0, decal: -12 }, { pos: [m.cotesH[0], m.cotesH[m.cotesH.length - 1]], v: 0, decal: -20 }],
        cotesV: [{ pos: nivFace, u: m.code === 'A' ? -5 : 0, decal: -8, cote: true }, { pos: [0, zMax], u: m.code === 'A' ? -5 : 0, decal: -26 }],
        textes: textesE });
      const yMin = m.code === 'A' ? -70 : (m.code === 'C' ? -20 : -95);
      const droite = P.vue(m, 'droite', { ech: c.ech, sol, equip: true, rideaux: m.code === 'A', mur: m.murY, filtre: p => !/^Joue/.test(p.nom), margeG: 12, margeD: 24, margeB: 26,
        cotesH: [{ pos: [yMin, 0, m.code === 'B' ? 280 : 550, m.murY], v: m.code === 'B' ? -160 : 0, decal: -12 }],

      h += '<section class="paysage"><div class="feuille"><h2>' + m.code + ' · ' + m.nom + ' — vue de face et vue de droite</h2>' +

      // Feuille 2 : dessus + perspective

        cotesH: [{ pos: m.cotesH, v: yMin, decal: -10 }],
        cotesV: [{ pos: [yMin, m.murY], u: m.dims.L, decal: 12 }] });
      const iso = image(m.code, { W: 1500, H: 1100, rideauxOuverts: true, lacet: -0.6, tangage: 0.38 });
      h += '<div class="feuille"><h2>' + m.code + ' · ' + m.nom + ' — vue de dessus et perspective</h2>' +
        '<div class="vues" style="align-items:flex-start"><figure>' + dessus + '<figcaption>Vue de dessus, mur en haut</figcaption></figure>' +
        '<figure style="flex:1"><img src="' + iso + '" style="width:100%;max-height:150mm;object-fit:contain;border:0.5pt solid #ccc"><figcaption>Perspective, ' + (m.code === 'A' ? 'rideaux ouverts' : 'équipée') + '</figcaption></figure></div>' +
        cartouche(m.code + ' · ' + m.nom, 'Vue de dessus et perspective', c.echT, folio++) + '</div>';
      // Feuille 3 : cadres soudés
      h += '<div class="feuille"><h2>' + m.code + ' · Cadres soudés (vue de la face latérale)</h2><div class="vues" style="gap:8mm">';
      m.typesCadre.forEach(ft => {
        h += '<figure>' + P.cadre(ft, M.SECTIONS, c.echCadre) + '<figcaption><b>' + ft.nom + '</b> — ' + ft.inst + ' exemplaire' + (ft.inst > 1 ? 's' : '') + '<br>Section ' + M.SECTIONS[ft.sec].nom + '</figcaption></figure>';
      });
      h += '</div><p class="legende" style="max-width:170mm">Cercles rouges : écrous à sertir sur les deux faces latérales (cotes cumulées depuis le bas : à gauche montant avant, à droite montant arrière). Cercles bleus barrés : trous traversants de liaison entre modules. Triangles rouges : écrous à sertir sur la face avant. Cotes de droite proches du cadre : niveaux des traverses (dessus de traverse).</p>' +
        cartouche(m.code + ' · ' + m.nom, 'Cadres soudés', c.echCadreT, folio++) + '</div></section>';
    });
