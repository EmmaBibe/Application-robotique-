<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte CAZ-1 en 3D</title>
<style>
:root{--fond:#0f1512;--panneau:rgba(20,28,24,.92);--texte:#e6efe8;--doux:#9fb0a5;--trait:#2e3c34;--vert:#5fbf85}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fond);color:var(--texte);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#scene{position:fixed;inset:0}
.panneau{position:fixed;background:var(--panneau);border:1px solid var(--trait);border-radius:12px;padding:12px;z-index:3}
#info{top:12px;left:12px;width:330px;max-width:calc(100% - 24px)}
#fiche{bottom:12px;left:12px;width:330px;max-width:calc(100% - 24px);display:none}
h1{font-size:16px;margin:0 0 4px}
.sous{color:var(--doux);font-size:12px}
button{font:inherit;color:var(--texte);background:transparent;border:1px solid var(--trait);border-radius:8px;padding:5px 9px;cursor:pointer;margin:6px 4px 0 0}
button.actif{background:var(--vert);border-color:var(--vert);color:#fff}
</style>
</head>
<body>
<div id="scene"></div>
<div id="info" class="panneau">
  <h1>Carte automate de zone CAZ-1</h1>
  <div class="sous">150 x 110 mm, deux couches. Clic gauche pour tourner, molette pour zoomer, clic sur un composant pour sa fiche.</div>
  <button id="b-dessus" class="actif">Dessus</button><button id="b-dessous">Dessous</button><button id="b-comp" class="actif">Composants</button>
  <a href="systemes_autonome.html" style="color:var(--vert);margin-left:6px">Simulateur des systèmes</a>
</div>
<div id="fiche" class="panneau"></div>
<script type="importmap">
{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/OrbitControls.js";

const DONNEES = await (await fetch("lib/caz1_3d.json")).json();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById("scene").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2420);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 2000);
camera.position.set(-60, 170, 170);
const orbite = new OrbitControls(camera, renderer.domElement);
orbite.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x334433, 1.2));
const soleil = new THREE.DirectionalLight(0xffffff, 2.2);
soleil.position.set(-80, 200, 120); soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
Object.assign(soleil.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120 });
scene.add(soleil);

const W = DONNEES.largeur, H = DONNEES.hauteur, E = 1.6;
const charge = new THREE.TextureLoader();
const texDessus = charge.load("lib/caz1_texture_dessus.png"), texDessous = charge.load("lib/caz1_texture_dessous.png");
[texDessus, texDessous].forEach(t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; });
const tranche = new THREE.MeshStandardMaterial({ color: 0xc9b98a, roughness: 0.8 });
const matDessus = new THREE.MeshStandardMaterial({ map: texDessus, roughness: 0.45, metalness: 0.1 });
const matDessous = new THREE.MeshStandardMaterial({ map: texDessous, roughness: 0.45, metalness: 0.1 });
const carte = new THREE.Mesh(new THREE.BoxGeometry(W, E, H), [tranche, tranche, matDessus, matDessous, tranche, tranche]);
carte.receiveShadow = true;
scene.add(carte);

const composants = new THREE.Group();
const cliquables = [];
for (const c of DONNEES.composants) {
  const l = Math.max(0.8, c.x1 - c.x0), p = Math.max(0.8, c.y1 - c.y0);
  let geo;
  if (c.type === "CP_Elec" || c.type === "Buzzer") geo = new THREE.CylinderGeometry(Math.min(l, p) / 2, Math.min(l, p) / 2, c.h, 32);
  else geo = new THREE.BoxGeometry(l, c.h, p);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: c.couleur, roughness: c.type === "ESP32" ? 0.3 : 0.6, metalness: c.type === "ESP32" ? 0.8 : 0.05 }));
  m.position.set((c.x0 + c.x1) / 2 - W / 2, E / 2 + c.h / 2, (c.y0 + c.y1) / 2 - H / 2);
  m.castShadow = true;
  m.userData = c;
  composants.add(m);
  cliquables.push(m);
  if (c.type === "TerminalBlock") {
    const n = Math.round(l / 5.08);
    for (let k = 0; k < n; k++) {
      const vis = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.5, 16), new THREE.MeshStandardMaterial({ color: 0xb8b8b8, metalness: 0.9, roughness: 0.3 }));
      vis.position.set(c.x0 - W / 2 + 2.5 + k * 5.08, E / 2 + c.h + 0.2, (c.y0 + c.y1) / 2 - H / 2);
      composants.add(vis);
    }
  }
  if (c.type === "ESP32") {
    // module : circuit support noir, blindage métallique côté puces, antenne imprimée en débord à gauche
    m.material = new THREE.MeshStandardMaterial({ color: 0x1b1f2a, roughness: 0.6 });
    m.scale.y = 0.8 / c.h; m.position.y = E / 2 + 0.4;
    const ant = 6.3, lb = l - ant - 1.0;
    const blindage = new THREE.Mesh(new THREE.BoxGeometry(lb, 2.4, p - 2.0),
      new THREE.MeshStandardMaterial({ color: 0xc9ccd1, metalness: 0.9, roughness: 0.28 }));
    blindage.position.set(c.x1 - W / 2 - 0.5 - lb / 2, E / 2 + 0.8 + 1.2, (c.y0 + c.y1) / 2 - H / 2);
    blindage.castShadow = true;
    composants.add(blindage);
    const piste = new THREE.Mesh(new THREE.PlaneGeometry(ant - 1.2, p - 4),
      new THREE.MeshStandardMaterial({ color: 0xb08a3a, metalness: 0.7, roughness: 0.4 }));
    piste.rotation.x = -Math.PI / 2;
    piste.position.set(c.x0 - W / 2 + ant / 2, E / 2 + 0.81, (c.y0 + c.y1) / 2 - H / 2);
    composants.add(piste);
  }
  if (c.ref === "J3") {
    // module Ethernet W5500 enfiché sur l'embase : carte bleue et prise RJ45
    const mod = new THREE.Group();
    const pcb = new THREE.Mesh(new THREE.BoxGeometry(23, 1.6, 25), new THREE.MeshStandardMaterial({ color: 0x1d3f8f, roughness: 0.5 }));
    const rj = new THREE.Mesh(new THREE.BoxGeometry(16, 13.5, 16), new THREE.MeshStandardMaterial({ color: 0xd8dade, metalness: 0.85, roughness: 0.3 }));
    rj.position.set(3.5, 7.5, 0);
    const puce = new THREE.Mesh(new THREE.BoxGeometry(7, 1.2, 7), new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.5 }));
    puce.position.set(-6, 1.4, 4);
    mod.add(pcb, rj, puce);
    mod.position.set((c.x0 + c.x1) / 2 - W / 2 - 8, E / 2 + c.h + 0.8, (c.y0 + c.y1) / 2 - H / 2 + 9);
    mod.traverse(o => { o.castShadow = true; });
    composants.add(mod);
  }
  if (c.type === "Relay") {
    const lab = document.createElement("canvas"); lab.width = 256; lab.height = 128;
    const x = lab.getContext("2d"); x.fillStyle = "#1f5fbf"; x.fillRect(0, 0, 256, 128); x.fillStyle = "#fff"; x.font = "bold 30px sans-serif";
    x.fillText("SONGLE", 20, 45); x.font = "22px sans-serif"; x.fillText("SRD-24VDC-SL-C", 20, 80); x.fillText("10A 250VAC", 20, 110);
    const t = new THREE.CanvasTexture(lab); t.colorSpace = THREE.SRGBColorSpace;
    const dessus = new THREE.Mesh(new THREE.PlaneGeometry(l * 0.9, p * 0.9), new THREE.MeshStandardMaterial({ map: t }));
    dessus.rotation.x = -Math.PI / 2; dessus.position.set(m.position.x, E / 2 + c.h + 0.02, m.position.z);
    composants.add(dessus);
  }
}
scene.add(composants);

const fiche = document.getElementById("fiche");
const rayon = new THREE.Raycaster(), souris = new THREE.Vector2();
renderer.domElement.addEventListener("click", ev => {
  souris.set(ev.clientX / innerWidth * 2 - 1, -ev.clientY / innerHeight * 2 + 1);
  rayon.setFromCamera(souris, camera);
  const h = rayon.intersectObjects(cliquables)[0];
  if (!h) { fiche.style.display = "none"; return; }
  const c = h.object.userData;
  fiche.innerHTML = `<b>${c.ref} · ${c.valeur}</b><br><span class="sous">${c.description || ""}</span>${c.fabricant ? `<br><span class="sous">Réf. : ${c.fabricant}</span>` : ""}`;
  fiche.style.display = "block";
});
const vue = dessus => {
  carte.rotation.x = dessus ? 0 : Math.PI;
  composants.visible = dessus && document.getElementById("b-comp").classList.contains("actif");
  document.getElementById("b-dessus").classList.toggle("actif", dessus);
  document.getElementById("b-dessous").classList.toggle("actif", !dessus);
};
document.getElementById("b-dessus").onclick = () => vue(true);
document.getElementById("b-dessous").onclick = () => vue(false);
document.getElementById("b-comp").onclick = e => { e.target.classList.toggle("actif"); composants.visible = e.target.classList.contains("actif") && carte.rotation.x === 0; };
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function boucle() { orbite.update(); renderer.render(scene, camera); requestAnimationFrame(boucle); })();
</script>
</body>
</html>
